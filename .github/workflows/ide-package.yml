name: Package Michael IDE (Mac + Windows)

# Builds installable Michael IDE bundles for macOS (universal: Intel + Apple
# Silicon) and Windows (x64). Run it manually from the Actions tab
# ("Run workflow"), or push a tag like `ide-v1.0.0` to also publish a GitHub
# Release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags: ["ide-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # Disable updater artifacts: they require a signing key we don't set
            # here, and would otherwise fail the build.
            args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":false}}'
          - os: windows-latest
            label: Windows x64
            rust_targets: ""
            args: '--config {"bundle":{"createUpdaterArtifacts":false}}'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ide/src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Install frontend deps
        working-directory: ide
        run: npm install

      - name: Build & package
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ide
          args: ${{ matrix.args }}
          # When triggered by an `ide-v*` tag, publish a GitHub Release with the
          # installers. On a manual run these stay empty, so it just builds and
          # the bundles are uploaded as workflow artifacts (below).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Michael IDE {0}', github.ref_name) || '' }}
          releaseBody: "Auto-built Michael IDE installers for macOS (universal) and Windows."
          releaseDraft: false
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: michael-ide-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ide/src-tauri/target/**/release/bundle/dmg/*.dmg
            ide/src-tauri/target/**/release/bundle/macos/*.app
            ide/src-tauri/target/**/release/bundle/msi/*.msi
            ide/src-tauri/target/**/release/bundle/nsis/*.exe
