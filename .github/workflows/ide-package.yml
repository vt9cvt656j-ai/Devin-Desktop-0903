name: Package Mr. Day One (macOS DMG + Windows EXE/MSI)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ide-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 三个目标各自在**原生** runner 上构建，不做交叉编译。
          #
          # 这里以前只有 arm64 + Windows，注释说"仓库只提交了 aarch64 那个 sidecar，
          # 要做 Intel 先补二进制"。那条理由**已经不成立**：下面的构建步骤现在从
          # automation-framework 源码逐目标现编 sidecar，仓库里提交的二进制只服务本机开发。
          #
          # runner 标签是查过的，不是照着老模板抄的：
          #   · macos-15        arm64 / 3 核，标准 runner。上一版写的是 macos-14，
          #                     那个已被 GitHub 标记 deprecated，早晚整批下线。
          #   · macos-15-intel  x64 / 4 核，标准 runner（不是要付费的 larger runner）。
          #                     注意不能写 macos-13——那批 Intel 机器 2025-12-04 已经彻底停用，
          #                     写了不会报"编译失败"，而是任务根本排不到机器。
          #                     GitHub 说 x86_64 撑到 2027 秋，之后 Intel 包得另想办法。
          #   · windows-latest  Windows Server 2025。
          - label: macOS Apple Silicon DMG
            os: macos-15
            rust_target: aarch64-apple-darwin
            sidecar_path: ide/src-tauri/binaries/automation-server-aarch64-apple-darwin
            artifact_name: michael-ide-macos-arm64
            artifact_paths: |
              ide/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              ide/target/aarch64-apple-darwin/release/bundle/macos/*.app
              ide/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              ide/target/aarch64-apple-darwin/release/bundle/macos/*.sig

          - label: macOS Intel DMG
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            sidecar_path: ide/src-tauri/binaries/automation-server-x86_64-apple-darwin
            artifact_name: michael-ide-macos-x64
            artifact_paths: |
              ide/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              ide/target/x86_64-apple-darwin/release/bundle/macos/*.app
              ide/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              ide/target/x86_64-apple-darwin/release/bundle/macos/*.sig

          - label: Windows x64 EXE + MSI
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            # Windows 独有的窗口配置（decorations:false）。
            #
            # 这份配置文件一直存在、内容也一直是对的，但**从没生效过**：Tauri 2 只在
            # 没有显式 --config 时才自动合并 tauri.<platform>.conf.json，而下面的构建
            # 步骤为了 createUpdaterArtifacts 传了 --config，于是平台配置被整个跳过。
            #
            # 后果是用户报的三件事，其实是同一件：原生标题栏没被关掉，压在应用自绘的
            # 那条 44px 标题栏上面——两条叠着、标题显示两遍、自绘的最小化/最大化/关闭
            # 三个键被压在下面点不到（「右上角缺少关闭按钮」），全屏也被原生那条挡住。
            extra_config: --config src-tauri/tauri.windows.conf.json
            sidecar_path: ide/src-tauri/binaries/automation-server-x86_64-pc-windows-msvc.exe
            artifact_name: michael-ide-windows-x64-exe-msi
            artifact_paths: |
              ide/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              ide/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
              ide/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              ide/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # macOS 代码签名：runner 的钥匙串是空的，必须先把证书导进去。
      #
      # 为什么不能"没证书就 ad-hoc 凑合"
      # --------------------------------
      # macOS 把隐私授权（辅助功能 / 屏幕录制 / 自动化 / 完全磁盘访问）钉在代码签名的
      # **指定要求**上。ad-hoc 签名拿不出证书，指定要求退化成 `cdhash H"…"`——那是
      # 这一次构建的字节哈希。于是每发一版，用户之前授的权全部作废，而系统设置里的开关
      # 还照样亮着。这就是 28428fe 花整整一次提交根治的那个 bug。
      #
      # 所以这里**宁可让构建红，也不打一个会悄悄废掉用户授权的包**：ad-hoc 出来的产物
      # 装得上、跑得起来、构建全绿，坏处要等用户更新完才显形，那时已经发出去了。
      #
      # 证书从 secret 来，和本机是同一张（scripts/setup-ci-signing-secrets.sh 上传的），
      # 所以 CI 包和本地包的指定要求逐字节相同，用户授权一次跨版本长期有效。
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # 身份名以 tauri.conf.json 为准，secret 只在将来换 Developer ID 时用来覆盖。
          # 两处各写一份必然会漂移，而漂移的表现是构建最后一步才失败。
          CONFIG_ID="$(python3 -c 'import json;print((json.load(open("ide/src-tauri/tauri.conf.json")).get("bundle",{}).get("macOS",{}) or {}).get("signingIdentity") or "")')"
          IDENTITY="${APPLE_SIGNING_IDENTITY_SECRET:-$CONFIG_ID}"

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::error::缺少 APPLE_CERTIFICATE secret，无法用固定身份「${IDENTITY}」签名。"
            echo "::error::拒绝改用 ad-hoc 签名——那样打出来的包会让用户每次更新后隐私授权失效，"
            echo "::error::而系统设置里的开关仍然显示为打开，几乎不可能被发现。"
            echo "::error::在本机跑一次即可修好：ide/scripts/setup-ci-signing-secrets.sh"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          # 默认 5 分钟不用就自动上锁；编译要十几分钟，锁上之后 codesign 会在最后一步
          # 失败，报的还是含糊的 "User interaction is not allowed"。这里关掉超时。
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # 不设分区列表，codesign 取私钥时会弹 GUI 授权框——无人值守的 runner 上
          # 表现为构建卡到超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          # 加进搜索列表（codesign 只找搜索列表里的钥匙串），并保留原有的。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 名字对得上还不够，得真的能拿它签。私钥没导进去时 codesign 会在十几分钟编译
          # 之后的最后一步才失败——那时机器时间已经白烧了。这里先花 0.1 秒问一句。
          if ! security find-identity -p codesigning "$KEYCHAIN" | grep -qF "$IDENTITY"; then
            echo "::error::证书导入了，但钥匙串里找不到可用于签名的身份「${IDENTITY}」。"
            security find-identity -p codesigning "$KEYCHAIN" || true
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份已就位：$IDENTITY"

      - name: Decide whether to notarize
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 只有三个**都非空**时才把它们放进后续步骤的环境。
          #
          # 不能直接在 tauri-action 的 env 里写 `${{ secrets.APPLE_ID }}`：secret 缺失时
          # 那是**空字符串**，而 Tauri 判的是"变量在不在"，空串照样算在——它于是认为你要
          # 公证，然后在校验 Team ID 时报 `Team ID must be at least 3 characters` 直接失败。
          # 本机构建之所以正常，是因为那三个变量**根本没定义**，Tauri 打一句"跳过公证"就过了。
          # 这里复现本机那个语义：要么三个都给，要么一个都不给。
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "公证凭据齐全，本次会走公证。"
          else
            echo "::notice::没有配齐 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID，跳过公证。"
            echo "::notice::包仍然用固定证书签名（隐私授权跨版本有效），只是用户首次打开时"
            echo "::notice::Gatekeeper 会提示「来自身份不明的开发者」，右键打开即可。"
          fi

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret; refusing to publish an unsigned updater.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ide/src-tauri -> ide/target

      - name: Install frontend dependencies
        working-directory: ide
        run: npm ci

      - name: Validate release version
        working-directory: ide
        env:
          MICHAEL_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/validate-release-version.mjs

      # 从源码构建 sidecar，而不是信任仓库里那个提交上来的二进制。
      #
      # 之前这一步只有 `Test-Path`：一个 8.9MB 的预编译文件，没人重建、没人核对哈希，
      # 就这么被 externalBin 打进**签名安装包**发给每个用户。仓库里的二进制一旦被换掉
      # （误提交、分支被污染、任何一次不小心），签名会照常盖上去。
      #
      # 现在每次发布都从 automation-framework 的源码重新编译，产物覆盖到 externalBin
      # 期望的路径上。这样"安装包里的 sidecar"和"仓库里的源码"永远对得上。
      - name: Build automation sidecar from source
        working-directory: ide/automation-framework
        run: cargo build --release --features "system browser" --bin automation-server --target ${{ matrix.rust_target }}

      - name: Install built sidecar into the bundle path
        shell: bash
        run: |
          set -euo pipefail
          src="ide/automation-framework/target/${{ matrix.rust_target }}/release/automation-server"
          [ -f "$src" ] || src="$src.exe"
          if [ ! -f "$src" ]; then
            echo "sidecar 构建产物不存在：$src" >&2
            exit 1
          fi
          mkdir -p "$(dirname '${{ matrix.sidecar_path }}')"
          cp "$src" '${{ matrix.sidecar_path }}'
          echo "sidecar 已从源码构建并就位："
          ls -la '${{ matrix.sidecar_path }}'

      - name: Verify bundled automation sidecar
        shell: pwsh
        run: |
          if (-not (Test-Path '${{ matrix.sidecar_path }}')) {
            throw 'Missing required Tauri sidecar: ${{ matrix.sidecar_path }}'
          }

      - name: Run frontend logic tests
        if: runner.os != 'Windows'
        working-directory: ide
        run: npm test

      - name: Build installable desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 上一步按有没有证书解析出来的身份（真实 Developer ID，或 ad-hoc 的 `-`）。
          # 它覆盖 tauri.conf.json 里那个只在本机存在的 `Mr Day One Local Signing`。
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          # 公证凭据**不在这里传**，见上面那个 "Decide whether to notarize" 步骤：
          # 在这里写 `APPLE_ID: ${{ secrets.APPLE_ID }}`，secret 缺失时得到的是**空字符串**，
          # 而 Tauri 判的是"这个变量在不在"，空串照样算在——于是它当成"你要公证"，
          # 走到校验就炸 `Team ID must be at least 3 characters`。实测 2026-08-19，
          # 两个 macOS 任务都是编译签名全过、最后死在这一步。
        with:
          projectPath: ide
          args: --target ${{ matrix.rust_target }} --config src-tauri/tauri.package.conf.json ${{ matrix.extra_config }} --ci
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Mr. Day One ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # 产物里不许出现面向模型的散文（提示词、工具用法说明、场景触发器）。
      #
      # **必须在构建之后**：这条流水线是先跑测试再构建，那一轮里 dist/ 还不存在。
      # 判据建立在**解码后的字符串表**上，不是明文 grep —— 混淆器把四分之三的字面量
      # 搬进了打乱字母表的 base64 表，`grep 【vs 替代】` 会报「干净」而表里有 68 条。
      #
      # IDE_RELEASE_CHECK=1 是显式的发布标志：置了它，「dist 不在」就从「跳过」变成
      # 「红」——发布路径上「没跑」不等于「通过」。
      - name: Verify no model-facing prose shipped in the bundle
        shell: bash
        working-directory: ide
        env:
          IDE_RELEASE_CHECK: "1"
        run: node --test test/bundle-ip-leak.test.mjs

      # 验收签名的**结果**，而不是"导入步骤跑过了"。
      #
      # 上一步只能证明钥匙串里有身份；真正要保证的是打出来的 .app 的指定要求不再是
      # cdhash 形式——那才等于"用户授权一次跨版本长期有效"。中间任何一环出岔子
      # （tauri 忽略了配置、签的是别的身份、嵌套二进制漏签），构建依然全绿，
      # 只有这一句会红。scripts/build-signed.sh 在本地做的就是这件事，CI 不能少。
      - name: Verify the shipped app is not pinned to this build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="ide/target/${{ matrix.rust_target }}/release/bundle/macos/Mr. Day One.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到 ${APP}，无法校验签名。"
            ls -la "ide/target/${{ matrix.rust_target }}/release/bundle/macos" || true
            exit 1
          fi
          req="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^#\{0,1\} *designated => //p')"
          echo "指定要求：$req"
          case "$req" in
            "")       echo "::error::读不到指定要求，无法确认。"; exit 1 ;;
            cdhash*)  echo "::error::签名仍钉在本次构建的 cdhash 上——这个包一旦发出去，"
                      echo "::error::用户更新后隐私授权会全部失效，而系统设置里的开关照常亮着。"
                      exit 1 ;;
          esac
          # 嵌套的 sidecar 也得签上，否则 App 启动它时会被系统拦下。
          codesign --verify --deep --strict "$APP"
          echo "✅ 身份跨构建稳定，嵌套二进制签名完整。"

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
