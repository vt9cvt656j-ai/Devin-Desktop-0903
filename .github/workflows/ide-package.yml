name: Package Michael IDE (macOS + Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ide-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            rust_target: aarch64-apple-darwin
            artifact_name: michael-ide-macos-apple-silicon
            artifact_paths: |
              ide/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: michael-ide-windows-x64
            artifact_paths: |
              ide/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              ide/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ide -> target

      - name: Install frontend dependencies
        working-directory: ide
        run: npm ci

      - name: Verify bundled automation server (macOS)
        if: runner.os == 'macOS'
        run: test -f ide/src-tauri/binaries/automation-server-${{ matrix.rust_target }}

      - name: Verify bundled automation server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "ide/src-tauri/binaries/automation-server-${{ matrix.rust_target }}.exe")) {
            throw "Missing automation-server sidecar for ${{ matrix.rust_target }}"
          }

      - name: Build installable bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ide
          args: --target ${{ matrix.rust_target }} --config src-tauri/tauri.package.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
