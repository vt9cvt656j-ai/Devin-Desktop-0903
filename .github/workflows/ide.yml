name: IDE

on:
  push:
    # `main`/`trunk` are the intended long-term trunk names; the repo's current
    # default branch is included so push CI runs today (cleaned up once a single
    # trunk is settled on).
    branches: [main, trunk, "devin/initial-implementation"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ide

jobs:
  lint:
    name: IDE lint + frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ide -> target

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

  app:
    name: Build IDE macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ide -> target

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Compile Tauri app
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # Windows 编译门禁。这条以前不存在：push/PR 只跑 ubuntu + macos，而 67 处
  # `cfg(target_os = "windows")` / `cfg(windows)` 分支在这两个平台上**根本不进编译单元** ——
  # 语法错、类型错、调用不存在的 API，全都查不出来。唯一会在 windows-latest 上编译的
  # 是 ide-package.yml，而它只能手动触发。也就是说一个打断 Windows 编译的改动可以
  # 一路全绿地待到有人推 tag，那时版本号已经烧掉了。
  #
  # 只做 check 不做 build：check 几分钟就完，而完整 build + 打包在 ide-package.yml 里。
  # （链接期那一类失败 check 查不到 —— 那条由 scripts/release-preflight.sh 的
  # `cargo xwin build` 在打 tag 前兜着。）
  windows-check:
    name: Windows 编译门禁
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ide -> target

      - name: Compile-check the desktop app for Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # sidecar 是**独立 crate**，Tauri 不会顺带编它，所以必须单独查一次。
      - name: Compile-check the automation sidecar for Windows
        run: cargo check --manifest-path automation-framework/Cargo.toml --all-targets

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # 这 2748 条测试**从来没有在 Windows 上跑过一次**：ide-package.yml 里那一步带着
      # `if: runner.os != 'Windows'`，而那条流水线本来就只能手动触发。
      #
      # ⚠️ 这一步是**故意**允许失败的，而且这是个明确的半步、不是终点：
      # 没有人知道它今天是红是绿，而把一条状态未知的检查直接设成硬门禁，会让所有 PR
      # 从明天起全部卡住 —— 那不是「发现问题」，那是「换一种方式坏掉」。
      # 先让它把真实状态**打印出来**，第一次跑完有人分诊过之后，
      # **就该把 continue-on-error 删掉、变成硬门禁**。
      #
      # 和被本次一并修掉的 release-preflight 那句「静默跳过」的区别在于：
      # 那一条是**假装通过**（跳过之后照样打印「✅ 全部通过」），
      # 这一条是**如实标注**（GitHub 上会显示成带警告的通过，日志里是完整的失败清单）。
      - name: Run frontend logic tests on Windows (informational until triaged)
        continue-on-error: true
        run: node --test test/*.test.mjs
