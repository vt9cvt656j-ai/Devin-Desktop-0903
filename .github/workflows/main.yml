name: Build IDE (macOS + Windows)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ide/src-tauri -> target"
      - name: Install frontend deps
        working-directory: ./ide
        run: npm ci
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ide
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Michael IDE ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
      - name: Upload installers as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: michael-ide-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            ide/target/**/release/bundle/dmg/*.dmg
            ide/target/**/release/bundle/macos/*.app.tar.gz
            ide/target/**/release/bundle/nsis/*.exe
            ide/target/**/release/bundle/msi/*.msi
