<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Mr. Day One · Sign in</title>
<link rel="icon" type="image/png" href="/console/logo.png" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --card: #fff; --ink: #09090b; --muted: #71717a;
    --line: #e4e4e7; --field: #fff; --brand: #2563eb; --brand-ink: #fff;
    --soft: #f4f4f5; --err: #dc2626; --ok: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --card: #131316; --ink: #fafafa; --muted: #a1a1aa;
      --line: #27272a; --field: #18181b; --soft: #1f1f23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 400px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 22px; display: block; }
  h1 { font-size: 26px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 650; }
  .sub { margin: 0 0 28px; font-size: 15px; color: var(--muted); }
  form { text-align: left; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 10px; margin-bottom: 14px;
    border: 1px solid var(--line); background: var(--field); color: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  button.primary {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink);
    transition: opacity .15s, transform .08s;
  }
  button.primary:hover { opacity: .93; }
  button.primary:active { transform: scale(.99); }
  button.primary:disabled { opacity: .55; cursor: default; transform: none; }
  /* No reserved height: an empty status row was pushing the providers ~50px down the
     page. It collapses when there is nothing to say and takes its margin with it. */
  .msg { margin-top: 12px; font-size: 13px; text-align: center; color: var(--muted); }
  .msg:empty { display: none; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .foot { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .link {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--brand); cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .back { margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); margin: -6px 0 14px; }
  /* 「(optional)」比标签本身轻一档：它说明的是「可以不填」，不该和字段名争注意力。 */
  .opt { font-weight: 400; color: var(--muted); }
  .ref-note {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 14px; padding: 10px 12px;
    font-size: 13px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--soft); color: var(--fg);
  }
  .ref-note b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
  .or {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 12px; font-size: 12px; color: var(--muted);
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .providers { display: flex; flex-direction: column; gap: 10px; }
  .pv {
    /* 图标和文字作为一组居中。原来是「图标贴左 + 文字 flex:1 左对齐」，
       三个按钮的文字起点被各自的图标宽度推着走，整排看上去是歪的。
       徽章改成绝对定位钉在右边，这样它在不在都不会把中间那组推偏。 */
    display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative; width: 100%;
    padding: 12px 14px; font: inherit; font-size: 14.5px; font-weight: 550;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: inherit; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .pv:hover:not(:disabled) { background: var(--soft); border-color: color-mix(in srgb, var(--ink) 22%, var(--line)); }
  .pv:disabled { cursor: not-allowed; opacity: .5; }
  .pv .mark { width: 18px; height: 18px; flex: none; }
  .pv .txt { flex: none; text-align: center; }
  /* "Soon" is the starting state, not the permanent one: the page asks the gateway which
     providers have credentials and takes the badge off those that do. A button that looks
     live but cannot sign anyone in is worse than an honest one. */
  .soon {
    position: absolute; right: 14px;
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px;
  }
  /* Applied only once the desktop app has actually answered on loopback, so the
     promoted button never promises a handoff that cannot happen. */
  .pv.is-live {
    border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
    background: color-mix(in srgb, var(--brand) 6%, var(--card));
  }
  .pv.is-live:hover:not(:disabled) { background: color-mix(in srgb, var(--brand) 11%, var(--card)); }
  .tag {
    position: absolute; right: 14px;
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--brand);
    border: 1px solid color-mix(in srgb, var(--brand) 40%, transparent);
    border-radius: 999px; padding: 2px 7px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/console/logo.png" alt="" />
    <h1 id="title">Welcome to Mr. Day One</h1>
    <p class="sub" id="subtitle">Create an account or sign in to continue</p>

    <!-- step 1: which email -->
    <form id="emailForm" autocomplete="on">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="username" placeholder="you@company.com" />
      <button class="primary" id="emailBtn" type="submit">Continue</button>
    </form>

    <!-- step 2a: returning user -->
    <form id="loginForm" autocomplete="on" hidden>
      <p class="back"><button type="button" class="link" data-back>← <span id="loginEmail"></span></button></p>
      <label for="pw">Password</label>
      <input id="pw" type="password" required autocomplete="current-password" placeholder="••••••••" />
      <button class="primary" id="loginBtn" type="submit">Log in</button>
    </form>

    <!-- step 2b: new user — register needs an emailed code -->
    <form id="signupForm" autocomplete="on" hidden>
      <p class="back"><button type="button" class="link" data-back>← <span id="signupEmail"></span></button></p>
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code" />
      <p class="hint">We emailed you a code. It expires shortly.</p>
      <label for="newpw">Choose a password</label>
      <input id="newpw" type="password" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8" />
      <!--
        邀请码。可选，而且是全站唯一能手动输入它的地方。
        产品文案一直写着「或者填了你邀请码的人都算你的」，但在这之前根本没有可填的地方 ——
        邀请码只能通过带 ?ref= 的链接生效，直接把码给朋友是无效的。
        这里写进的是和链接完全同一个键（mide_ref），所以后面的绑定逻辑一行都不用改。
      -->
      <label for="refcode">Invite code <span class="opt">(optional)</span></label>
      <input id="refcode" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. 3Y37R9A5" maxlength="12" />
      <button class="primary" id="signupBtn" type="submit">Create account</button>
    </form>

    <!--
      邀请横幅。地址栏里的 ?ref= 会被 parkReferral 抹掉（避免刷新重复处理、避免这个码跟着
      历史记录和 referer 到处跑），但抹掉之后页面和普通登录页一模一样 —— 用户看不出邀请
      关系还在不在，只能以为链接失效了。所以把记住的码摆出来。
    -->
    <div class="ref-note" id="refNote" hidden></div>

    <div class="msg" id="msg"></div>

    <div id="providers">
      <div class="or">or</div>
      <div class="providers">
        <button class="pv" type="button" id="pvGithub" disabled aria-label="Continue with GitHub — not available yet">
          <svg class="mark" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span class="txt">Continue with GitHub</span>
          <span class="soon" id="pvGithubSoon">Soon</span>
        </button>
        <button class="pv" type="button" id="pvGoogle" disabled aria-label="Continue with Google — not available yet">
          <svg class="mark" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          <span class="txt">Continue with Google</span>
          <span class="soon" id="pvGoogleSoon">Soon</span>
        </button>
        <button class="pv" type="button" id="pvMrday" aria-label="Continue with Mr. Day One">
          <img class="mark" id="pvLogo" alt="" />
          <span class="txt">Continue with Mr. Day One</span>
          <span class="tag" id="pvTag" hidden>Desktop</span>
        </button>
      </div>
    </div>

    <p class="foot">New here? Enter your email and we will send a code.</p>
  </main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg");
  var forms = { email: $("emailForm"), login: $("loginForm"), signup: $("signupForm") };
  var state = { email: "" };

  // Only same-origin app paths may be redirected to, so ?next= can never become an
  // open redirect.
  var HOME = "/dashboard";
  var ALLOWED = ["/dashboard", "/billing", "/app"];
  function nextTarget() {
    try {
      var n = new URLSearchParams(location.search).get("next") || HOME;
      // Still only same-origin app paths: a leading "//" would be another host, and
      // anything outside these two prefixes is not ours to redirect to.
      if (n.charAt(0) === "/" && n.charAt(1) !== "/") {
        for (var i = 0; i < ALLOWED.length; i++) {
          if (n.indexOf(ALLOWED[i]) === 0) return n;
        }
      }
    } catch (e) {}
    return HOME;
  }
  function setMsg(t, cls) { msg.textContent = t || ""; msg.className = "msg" + (cls ? " " + cls : ""); }
  function show(which) {
    Object.keys(forms).forEach(function (k) { forms[k].hidden = k !== which; });
    $("title").textContent =
      which === "signup" ? "Create your account"
      : which === "login" ? "Welcome back"
      : "Welcome to Mr. Day One";
    $("subtitle").textContent =
      which === "signup" ? "Confirm your email and pick a password"
      : which === "login" ? "Enter your password to continue"
      : "Create an account or sign in to continue";
    var foot = document.querySelector(".foot");
    if (foot) foot.hidden = which !== "email";
    var pv = $("providers");
    if (pv) pv.hidden = which !== "email";
    setMsg("");
  }
  async function post(path, body) {
    var r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    var j = await r.json().catch(function () { return {}; });
    return { ok: r.ok, data: j };
  }

  /*
   * A name for this browser, so Devices lists machines instead of sign-ins.
   *
   * Random and stored once. It is not a fingerprint: nothing is derived from the machine,
   * clearing site data forgets it, and it identifies a browser profile rather than a
   * person. The server treats it as display grouping only and grants nothing on it.
   *
   * Without one, signing in three times on this browser wrote three rows and the console
   * showed the same laptop three times at the same IP. With one, the second sign-in
   * replaces the first.
   */
  function deviceId() {
    var KEY = "mrday.device_id";
    try {
      var saved = localStorage.getItem(KEY);
      if (saved) return saved;
    } catch (e) {
      // Storage blocked — fall through and send a fresh id. Grouping degrades to the
      // server's User-Agent fallback, which is what happened before this existed.
    }
    var id;
    try {
      id = crypto.randomUUID();
    } catch (e) {
      // randomUUID is unavailable on http:// origins and in older browsers.
      var bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      id = Array.prototype.map.call(bytes, function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    }
    try { localStorage.setItem(KEY, id); } catch (e) {}
    return id;
  }

  // ---- Signing in with GitHub or Google -------------------------------------
  //
  // The buttons ship disabled and are switched on by asking the gateway which providers
  // have credentials. Doing it this way means adding the keys to the server lights the
  // button up with no change here, and — more to the point — a provider that is not set
  // up cannot present a button that sends someone to a broken authorize screen.
  var OAUTH = { github: $("pvGithub"), google: $("pvGoogle") };

  function startOauth(provider) {
    // device_id rides along so an OAuth sign-in joins this browser's existing device row
    // instead of opening a second one. The callback is a fresh navigation and cannot read
    // storage, so this is the only chance to send it.
    var url = "/api/auth/oauth/" + provider + "/start"
      + "?next=" + encodeURIComponent(nextTarget())
      + "&device_id=" + encodeURIComponent(deviceId());
    location.href = url;
  }

  (async function offerProviders() {
    var live;
    try {
      var r = await fetch("/api/auth/oauth/providers", { cache: "no-store" });
      if (!r.ok) return;
      live = await r.json();
    } catch (e) {
      // Offline or an older gateway. The buttons stay as they are — honestly disabled.
      return;
    }
    Object.keys(OAUTH).forEach(function (name) {
      var btn = OAUTH[name];
      if (!btn || !live[name]) return;
      btn.disabled = false;
      btn.setAttribute("aria-label", "Continue with " + (name === "github" ? "GitHub" : "Google"));
      var badge = $("pv" + (name === "github" ? "Github" : "Google") + "Soon");
      if (badge) badge.remove();
      btn.addEventListener("click", function () { startOauth(name); });
    });
  })();

  /*
   * Write the cookie that actually decides whether the app shell is served.
   *
   * Split out of finish() because resume() needs it too, and the two getting out of step
   * is not a cosmetic bug: nginx gates /dashboard on `$cookie_mide_token` alone, while
   * this page decides "already signed in" from localStorage first. Redirecting on the
   * strength of a token without also writing the cookie sends the person to a route that
   * is guaranteed to bounce them straight back here.
   */
  function writeSessionCookie(token) {
    // The cookie nginx checks before serving the app shell. Real API calls still carry
    // the Bearer token and are authorized per request.
    // Lax, not Strict. Strict withholds the cookie on EVERY cross-site navigation —
    // including the one where Stripe returns the buyer to /billing after paying. The gate
    // then saw no cookie, decided nobody was signed in, and bounced them back here: from
    // the buyer's side, paying logged them out and the payment appeared to vanish.
    //
    // Lax still withholds it from cross-site subresources and cross-site POSTs, which is
    // where CSRF lives. It only adds it back on top-level GET navigation — exactly the
    // return-from-checkout case, and nothing that can be triggered silently.
    // Domain=.mrday.one, not host-only.
    //
    // The marketing site is served from the apex and the gateway from code.mrday.one, so a
    // host-only cookie is invisible to the site — someone with a live session was still
    // being asked to log in there. Widening it to the registrable domain lets the site
    // read the token and greet them by name.
    //
    // It stays SameSite=Lax: the site sends the token as an Authorization header, never as
    // a cross-site cookie, so nothing here loosens the console's CSRF posture. What it does
    // mean is that any *.mrday.one origin can read a session token — fine while those are
    // the gateway and the site, and a reason not to host untrusted content on a subdomain.
    document.cookie = "mide_token=" + encodeURIComponent(token) + "; Domain=.mrday.one; Path=/; Secure; SameSite=Lax; Max-Age=" + (7 * 24 * 3600);
    try { localStorage.setItem("michael_token", token); } catch (e) {}
  }

  /*
   * Last-resort loop breaker.
   *
   * Everything above is meant to stop the gate and the guarded route from disagreeing —
   * but if they ever do again, the failure mode is the worst one available: the page
   * reloads forever and the person can neither get in nor sign in. A redirect that comes
   * straight back within seconds is not a slow network, it is a loop; when that happens,
   * drop the token this page was trusting and show the form instead.
   *
   * sessionStorage, so it is scoped to this tab and gone when the tab closes. Time-bounded
   * rather than a plain flag: a real bounce returns in milliseconds, while coming back to
   * the gate on purpose is minutes later, and a flag with no clock would refuse to resume
   * a perfectly good session for the rest of the tab's life.
   */
  var BOUNCE_KEY = "mide_gate_redirect_at";
  var BOUNCE_WINDOW_MS = 10000;
  function cameStraightBack() {
    try {
      var at = parseInt(sessionStorage.getItem(BOUNCE_KEY) || "0", 10);
      return at > 0 && Date.now() - at < BOUNCE_WINDOW_MS;
    } catch (e) { return false; }
  }
  function leavingForApp() {
    try { sessionStorage.setItem(BOUNCE_KEY, String(Date.now())); } catch (e) {}
  }
  function forgetBounce() {
    try { sessionStorage.removeItem(BOUNCE_KEY); } catch (e) {}
  }

  function finish(token) {
    writeSessionCookie(token);
    setMsg("Signed in — taking you through…", "ok");
    leavingForApp();
    location.replace(nextTarget());
  }

  // Step 1 — does this address already have an account?
  forms.email.addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = $("emailBtn");
    btn.disabled = true; setMsg("Checking…");
    state.email = $("email").value.trim();
    try {
      var res = await post("/api/auth/check-email", { email: state.email });
      var exists = !!(res.data && (res.data.exists || res.data.registered));
      $("loginEmail").textContent = state.email;
      $("signupEmail").textContent = state.email;
      // An account created through a provider has no password, so the password step would
      // be a box nothing can satisfy. Stay here instead — this is the step the provider
      // buttons are visible on — and say which one to press.
      var providers = (res.data && res.data.providers) || [];
      if (exists && res.data && res.data.password === false && providers.length) {
        var names = providers.map(function (p) { return p === "github" ? "GitHub" : p === "google" ? "Google" : p; });
        setMsg("This account signs in with " + names.join(" or ") + ". Use the button below.", "");
        btn.disabled = false;
        return;
      }
      if (exists) {
        show("login");
        setTimeout(function () { $("pw").focus(); }, 30);
      } else {
        var sent = await post("/api/auth/send-code", { email: state.email });
        if (!sent.ok) { setMsg((sent.data && sent.data.error) || "Could not send the code. Try again.", "err"); btn.disabled = false; return; }
        show("signup");
        setMsg("Code sent to " + state.email, "ok");
        setTimeout(function () { $("code").focus(); }, 30);
      }
    } catch (err) {
      setMsg("Network error. Please try again.", "err");
    }
    btn.disabled = false;
  });

  // Step 2a — existing account
  forms.login.addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = $("loginBtn");
    btn.disabled = true; setMsg("Signing in…");
    try {
      var res = await post("/api/auth/login", { email: state.email, password: $("pw").value, device: "web", device_id: deviceId() });
      if (!res.ok || !res.data.token) { setMsg(res.data.error || "That email and password do not match.", "err"); btn.disabled = false; return; }
      finish(res.data.token);
    } catch (err) {
      setMsg("Network error. Please try again.", "err"); btn.disabled = false;
    }
  });

  // Step 2b — new account
  forms.signup.addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = $("signupBtn");
    btn.disabled = true; setMsg("Creating your account…");
    // 在建号之前就把手填的邀请码存好：注册成功会立刻跳走，之后再存就没机会了。
    parkTypedReferral();
    try {
      var res = await post("/api/auth/register", {
        email: state.email,
        password: $("newpw").value,
        code: $("code").value.trim(),
        device: "web",
        device_id: deviceId(),
        // 邀请码跟着注册一起提交 —— 绑推荐人最准确的时机就是建号这一刻。
        // 存下来的那份仍然留着：这里绑不上（比如程序临时关闭），控制台加载时还会再试一次。
        referral_code: storedReferral(),
      });
      if (!res.ok) { setMsg(res.data.error || "That code did not work. Check it and try again.", "err"); btn.disabled = false; return; }
      if (res.data.token) return finish(res.data.token);
      var login = await post("/api/auth/login", { email: state.email, password: $("newpw").value, device: "web", device_id: deviceId() });
      if (login.ok && login.data.token) return finish(login.data.token);
      setMsg("Account created. Please sign in.", "ok");
      show("login");
      btn.disabled = false;
    } catch (err) {
      setMsg("Network error. Please try again.", "err"); btn.disabled = false;
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-back]"), function (b) {
    b.addEventListener("click", function () { show("email"); $("email").focus(); });
  });

  // The Mr. Day One provider is this page's own email flow, so reuse the header logo
  // rather than shipping the data URI a second time.
  var headerLogo = document.querySelector("img.logo");
  if (headerLogo) $("pvLogo").src = headerLogo.src;

  // ---- Desktop handoff -----------------------------------------------------
  /*
   * 桌面 App 已经登录了，这里就不该再让人输一遍密码。
   *
   * **不再走 loopback。** 以前是这个页面去打 http://127.0.0.1:47821 问 App。那条路做不成：
   * App 在跑、在听、CORS 预检正确返回了 Access-Control-Allow-Private-Network、本地网络权限
   * 也授予了，Chrome 依然以一句 TypeError: Failed to fetch 拒绝 —— HTTPS 页面访问明文
   * loopback 端口正是浏览器这几年一直在关掉的形状。整套探测连同它在控制台留下的报错一起删了。
   *
   * 换成经由网关的三方交接：
   *   1. 向网关要一个 nonce 和一个 secret；
   *   2. 打开 mrday://signin?nonce=…，由操作系统唤起 App（App 没开会被一并拉起，这是深链
   *      比 loopback 好的地方 —— 以前 App 没开就彻底没戏）；
   *   3. App 拿自己的登录令牌去认领这个 nonce，网关替它签一张网页会话；
   *   4. 这个页面拿 nonce + secret 去取。secret 从没进过链接，所以抢到深链的人取不走。
   */
  var HANDOFF_POLL_MS = 1000;
  var HANDOFF_TRIES = 60;        // 约一分钟，够点开系统弹窗 + App 冷启动

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function useDesktopSession() {
    var btn = $("pvMrday");
    var label = btn.querySelector(".txt");
    var was = label.textContent;
    btn.disabled = true;
    label.textContent = "Opening the desktop app…";
    setMsg("");

    try {
      var s = await post("/api/auth/handoff/start", {});
      if (!s.ok || !s.data || !s.data.nonce) {
        throw new Error((s.data && s.data.error) || "could not start");
      }
      var nonce = s.data.nonce, secret = s.data.secret;

      // 唤起 App。协议没注册时浏览器什么都不会发生 —— 下面的轮询会超时，
      // 那句提示会告诉用户去更新 App。
      try { location.href = "mrday://signin?nonce=" + encodeURIComponent(nonce); } catch (e) {}

      setMsg("Waiting for the desktop app… approve the prompt if your browser asks.");
      for (var i = 0; i < HANDOFF_TRIES; i++) {
        await sleep(HANDOFF_POLL_MS);
        var r = await post("/api/auth/handoff/poll", { nonce: nonce, secret: secret });
        if (r.ok && r.data && r.data.ready && r.data.token) return finish(r.data.token);
        // 交接过期或凭据不符 —— 再等下去也没有意义。
        if (!r.ok) break;
      }
      setMsg("The desktop app did not respond. Make sure it is open and up to date, or sign in with your email.", "err");
    } catch (e) {
      setMsg("Could not reach the desktop app. Sign in with your email instead.", "err");
    }
    btn.disabled = false;
    label.textContent = was;
  }

  $("pvMrday").addEventListener("click", function () { return useDesktopSession(); });

  function storedToken() {
    try {
      var v = localStorage.getItem("michael_token");
      if (v) return v;
    } catch (e) {}
    var m = document.cookie.match(/(?:^|;\s*)mide_token=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : "";
  }

  /*
   * Clicking "Log in" on the marketing site while holding a perfectly good session used
   * to land on this form, which reads as having been signed out. The token is verified
   * against /api/me rather than trusted for merely existing, so an expired or revoked one
   * falls through to the form instead of bouncing the person into a console that would
   * immediately throw them back here.
   *
   * The redirect writes the cookie first. This page reads localStorage before the cookie,
   * but nginx gates /dashboard on the cookie and nothing else — so resuming on a token
   * whose cookie is gone used to send the person to a route that bounced them right back,
   * forever. Signing out on the marketing site produced exactly that: mrday.one can delete
   * the shared cookie but cannot reach code.mrday.one's localStorage, so this page kept
   * finding a token, /api/me kept saying it was valid, and the login page reloaded on a
   * loop. Sign-out now revokes the session server-side (POST /api/auth/logout) so the
   * leftover copy is worthless; writing the cookie here closes the same gap for every
   * other way the two can drift — a cookie that expired at 7 days while the token is good
   * for 30, most obviously.
   */
  (async function resume() {
    show("email");
    var token = storedToken();
    if (!token) { forgetBounce(); $("email").focus(); return; }

    // We sent someone to the app a moment ago and here they are again. Whatever the app
    // checks, it is not happy with this token — stop trying, or this repeats forever.
    if (cameStraightBack()) {
      forgetBounce();
      try { localStorage.removeItem("michael_token"); } catch (e) {}
      document.cookie = "mide_token=; Domain=.mrday.one; Path=/; Max-Age=0";
      document.cookie = "mide_token=; Path=/; Max-Age=0";
      setMsg("Your session has ended. Please sign in again.", "err");
      $("email").focus();
      return;
    }

    // Hidden, not shown-then-replaced: a login form that flashes up and vanishes looks
    // like a glitch even when the redirect is instant.
    var wrap = document.querySelector("main.wrap");
    wrap.style.visibility = "hidden";
    try {
      var r = await fetch("/api/me", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
      if (r.ok) {
        // Restore the cookie before leaving: it is the only thing the guarded route reads.
        writeSessionCookie(token);
        leavingForApp();
        location.replace(nextTarget());
        return;
      }
      // Verified and rejected — revoked, expired, or the account is gone. Clear the copy
      // that is lying to us, so the next load starts from a clean slate rather than
      // repeating this request on every visit.
      try { localStorage.removeItem("michael_token"); } catch (e) {}
    } catch (e) {
      /* offline, or the gateway is down — fall through and let them use the form */
    }
    forgetBounce();
    wrap.style.visibility = "";
    $("email").focus();
  })();

  /*
   * How a failed or abandoned provider sign-in comes back.
   *
   * After resume(), and inside this wrapper, for two separate reasons. show() ends with
   * setMsg(""), and resume() calls show("email") on load — so a message written before it
   * is wiped a moment later, which showed up as the redirect working and the page coming
   * up blank. And everything here is scoped to the enclosing function, so a block moved
   * past its closing brace loses setMsg entirely.
   *
   * The server sends a fixed keyword, never provider text: that can carry someone else's
   * address, or a message we would be rendering into this page sight unseen.
   */
  var OAUTH_SAID = {
    cancelled: ["Sign-in was cancelled.", "muted"],
    unverified: ["That account's email address is not verified. Confirm it with your provider, then try again.", "err"],
    noemail: ["That provider did not release an email address, so there is nothing to create an account with.", "err"],
    unconfigured: ["That sign-in method is not enabled on this server yet.", "err"],
    unknown: ["Unknown sign-in method.", "err"],
    error: ["Sign-in failed. Please try again.", "err"]
  };

  /*
   * A referral link is /gate?ref=CODE. Park the code and get it out of the address bar.
   *
   * Parked rather than sent, because there is nobody to attach it to yet — the account may
   * not even exist. The console claims it after the session is live (see
   * claimPendingReferral in account-ui), which is also the only place that works for
   * GitHub and Google: those redirect from the provider straight to /dashboard and never
   * come back through this page.
   *
   * localStorage survives that round trip because the provider returns to this same
   * origin. The shape is checked here so nothing but a plausible code is ever stored, and
   * the value is dropped from the URL so a reload or a shared screenshot does not carry
   * somebody else's referral.
   */
  // 存下来的邀请码，localStorage 优先、cookie 兜底 —— 和控制台那边读的是同一套。
  function storedReferral() {
    var v = "";
    try { v = localStorage.getItem("mide_ref") || ""; } catch (e) {}
    if (!v) {
      var m = document.cookie.match(/(?:^|;\s*)mide_ref=([^;]+)/);
      v = m ? decodeURIComponent(m[1]) : "";
    }
    return v;
  }

  // 把记住的邀请码显示出来，并预填进注册表单。
  function showReferral() {
    var code = storedReferral();
    var el = document.getElementById("refNote");
    if (!el || !code) return;
    el.innerHTML = "";
    var span = document.createElement("span");
    span.appendChild(document.createTextNode("You were invited \u2014 code "));
    var b = document.createElement("b");
    b.textContent = code;               // textContent：这个值来自 URL，绝不能当 HTML 插
    span.appendChild(b);
    span.appendChild(document.createTextNode(" will be applied when you create your account."));
    el.appendChild(span);
    el.hidden = false;
    var input = document.getElementById("refcode");
    if (input && !input.value) input.value = code;
  }

  // 手填的邀请码走和链接同一条路：同一个键、同一套校验。
  function parkTypedReferral() {
    var el = document.getElementById("refcode");
    if (!el) return;
    var code = (el.value || "").trim().toUpperCase();
    if (!code) return;
    if (!/^[2-9A-HJ-NP-Z]{6,12}$/.test(code)) return;
    try { localStorage.setItem("mide_ref", code); } catch (e) {}
    try { document.cookie = "mide_ref=" + code + "; Path=/; Max-Age=2592000; SameSite=Lax; Secure"; } catch (e) {}
  }

  (function parkReferral() {
    var code;
    try { code = new URLSearchParams(location.search).get("ref"); } catch (e) { return; }
    if (!code) return;
    code = code.trim().toUpperCase();
    // Same alphabet the gateway mints from, minus the characters it refuses to use.
    if (!/^[2-9A-HJ-NP-Z]{6,12}$/.test(code)) return;
    try { localStorage.setItem("mide_ref", code); } catch (e) {}
    // 再存一份 cookie：隐私模式或第三方存储被禁时 localStorage 会静默失败，
    // 而这条路上每一个别的状态（令牌）都已经有 cookie 兜底，唯独邀请码没有。
    try { document.cookie = "mide_ref=" + code + "; Path=/; Max-Age=2592000; SameSite=Lax; Secure"; } catch (e) {}
    try {
      var u = new URL(location.href);
      u.searchParams.delete("ref");
      history.replaceState({}, "", u.toString());
    } catch (e) {}
  })();

  // 不只在带 ?ref= 时显示：上次存下的码这次打开照样有效，也该看得见。
  try { showReferral(); } catch (e) {}

  (function reportOauth() {
    var said;
    try { said = new URLSearchParams(location.search).get("oauth"); } catch (e) { return; }
    if (!said) return;
    var m = OAUTH_SAID[said] || OAUTH_SAID.error;
    setMsg(m[0], m[1] === "err" ? "err" : "");
    // Take it out of the address bar so a reload does not re-accuse.
    try {
      var url = new URL(location.href);
      url.searchParams.delete("oauth");
      history.replaceState({}, "", url.toString());
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
