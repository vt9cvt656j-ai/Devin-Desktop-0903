           搬进 React 只会让首屏多解析一遍，没有好处。

      <!-- The model mark.
           A sparkle was the wrong idea, not the wrong size: it means "AI magic" and says nothing
           about a model. Redrawing it bigger twice was fixing the wrong axis.

           What a model IS, drawn: inputs converging through a core to an output — a network with
           a centre of mass. That is why the hub is r2.9 while the peripheral nodes are r1.9; the
           weight sits where the computation does, and at 16px the eye reads that hierarchy before
           it resolves any individual node. Edges are 1.5 stroke with round caps so they stay
           visible when the glyph is scaled down and antialiased.

           The spark at the top right is the one borrowed idea, and it earns its place: a bare
           graph reads as "network" or "share". The spark is what makes it generative. It sits off
           the axis of symmetry so it reads as an accent rather than a fifth node.

           Three nodes, not five: at menu size every extra circle is mud. -->
      <symbol id="i-sparkle" viewBox="0 0 24 24">
