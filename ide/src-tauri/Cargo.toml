[package]
name = "devin-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Michael IDE: a macOS-style code editor with an AI assistant sidebar."
default-run = "devin-ide"

[lib]
name = "devin_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9.0"
notify = "7"
notify-debouncer-mini = "0.5"
once_cell = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "json", "mysql", "postgres", "any", "tls-rustls-ring", "chrono"] }
bcrypt = "0.19.2"
uuid = { version = "1.23.3", features = ["v4"] }
rand = "0.10.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
headless_chrome = { version = "1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.9"
redis = { version = "1.2.4", features = ["tokio-comp"] }
pdf-extract = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = "0.1.0"

[features]
default = []
macos-private-api = ["tauri/macos-private-api"]
custom-protocol = ["tauri/custom-protocol"]
