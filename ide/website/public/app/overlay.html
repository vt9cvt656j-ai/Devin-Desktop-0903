<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>控制中</title>
<style>
  /* Recording-style red glow shown while the agent is controlling the computer.
     Self-contained, no JS imports, no Monaco — just a transparent click-through frame.
     The window itself is made click-through via setIgnoreCursorEvents(true). */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden; pointer-events: none;
    -webkit-user-select: none; user-select: none;
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none; box-sizing: border-box;
    border: 5px solid rgba(255, 45, 45, 0.95);
    border-radius: 3px;
    box-shadow:
      inset 0 0 64px 14px rgba(255, 28, 28, 0.55),
      inset 0 0 0 2px rgba(255, 90, 90, 0.95),
      0 0 26px 6px rgba(255, 30, 30, 0.5);
    animation: glowPulse 1.7s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow:
        inset 0 0 48px 10px rgba(255, 28, 28, 0.40),
        inset 0 0 0 2px rgba(255, 90, 90, 0.85),
        0 0 18px 4px rgba(255, 30, 30, 0.35);
      border-color: rgba(255, 60, 60, 0.80); }
    50%  { box-shadow:
        inset 0 0 78px 18px rgba(255, 28, 28, 0.68),
        inset 0 0 0 2px rgba(255, 110, 110, 1),
        0 0 34px 9px rgba(255, 30, 30, 0.62);
      border-color: rgba(255, 40, 40, 1); }
  }
  /* small "● 控制中" badge top-center so the user knows what the glow means */
  .tag {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    font: 600 12px/1.4 -apple-system, "PingFang SC", system-ui, sans-serif;
    color: #fff; background: rgba(220, 30, 30, 0.92);
    padding: 3px 12px 3px 9px; border-radius: 999px; pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.35); letter-spacing: .3px; white-space: nowrap;
  }
  .tag .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: middle;
    animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="tag"><span class="dot"></span>Mr. Day One 正在控制电脑</div>
</body>
</html>
