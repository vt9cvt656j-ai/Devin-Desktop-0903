<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mr. Day One 管理后台</title>
    <!--
      管理后台的登录页。**故意**是一个独立的小页面，不是控制台 SPA 的一部分。

      /console/ 现在被 nginx 的 auth_request 挡住了：没有管理员 cookie 就一个字节都不发。
      但登录页必须能被没登录的人打开，否则谁也进不去。如果直接把 SPA 的 index.html 放出来
      当登录页，整个管理台的 bundle 又变成公开可下载的了 —— 门禁也就白设了。

      样式逐条对齐 admin-ui 的 Login.tsx 与 index.css 的令牌（zinc 色阶、Space Grotesk /
      Inter、h-12 输入框、rounded-lg），所以看上去和原来那一屏是同一个东西。字体声明是从
      构建产物里原样搬过来的，带 unicode-range，浏览器只会下它真正需要的那几个分片。
      脚本单独放在 login.js：这一页的 CSP 是 script-src 'self'，内联脚本会被拦掉。
    -->
    <link rel="icon" href="/console/logo.png" />
    <style>

      :root {
        --background: #fafafa;
        --foreground: #09090b;
        --card: #ffffff;
        --primary: #18181b;
        --primary-foreground: #fafafa;
        --muted-foreground: #52525b;
        --border: #e4e4e7;
        --input: #d4d4d8;
        --ring: #18181b;
        --destructive: #dc2626;
        --radius: 0.75rem;
        --font-display: "Space Grotesk", "PingFang SC", "Noto Sans SC", sans-serif;
        --font-sans: "Inter", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 1rem;
        -webkit-font-smoothing: antialiased;
      }
      form { width: 100%; max-width: 24rem; }
      .brand {
        margin-bottom: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand img {
        width: 3.5rem; height: 3.5rem;
        margin-bottom: 0.75rem;
        border-radius: 0.75rem;
      }
      .brand .name {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--foreground);
      }
      .brand .eyebrow {
        margin-top: 0.5rem;
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .card {
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: var(--card);
        padding: 1.5rem;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      label {
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--foreground);
        user-select: none;
      }
      input {
        height: 3rem;
        width: 100%;
        border-radius: 0.5rem;
        border: 1px solid var(--input);
        background: var(--card);
        padding: 0 1rem;
        font: inherit;
        font-size: 1rem;
        color: var(--foreground);
        transition: border-color 0.15s, box-shadow 0.15s;
        outline: none;
      }
      input::placeholder { color: var(--muted-foreground); }
      input:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 2px rgb(24 24 27 / 0.25);
      }
      .field-account { margin-bottom: 1rem; }
      .field-password { margin-bottom: 1.25rem; }
      button {
        display: inline-flex;
        height: 2.75rem;
        width: 100%;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        transition: all 0.2s;
      }
      button:hover:not(:disabled) { transform: scale(1.02); }
      button:active:not(:disabled) { transform: scale(0.98); }
      button:disabled { pointer-events: none; opacity: 0.5; }
      .msg {
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: var(--destructive);
        min-height: 0;
      }
      .msg:empty { display: none; }
    </style>
  </head>
  <body>
    <form id="f">
      <div class="brand">
        <img src="/console/logo.png" alt="Mr. Day One" width="56" height="56" />
        <div class="name">Mr. Day One</div>
        <p class="eyebrow">管理后台</p>
      </div>
      <div class="card">
        <div class="field-account">
          <label for="account">账号</label>
          <!--
            type="text"，不是 type="email"：管理员账号是用户名 fendoushaonian，
            浏览器会在提交前就把它判成非法邮箱，人根本进不来。
          -->
          <input id="account" name="username" type="text" placeholder="用户名或邮箱"
                 autocomplete="username" autocapitalize="none" autocorrect="off"
                 spellcheck="false" autofocus required />
        </div>
        <div class="field-password">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="••••••••"
                 autocomplete="current-password" required />
        </div>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
        <button id="go" type="submit">登录</button>
      </div>
    </form>
    <!--
      MSE 客户端。必须排在 login.js 前面 —— login.js 在模块初始化时就会读 window.MSE。

      这一页提交的是**管理员**密码，是整个系统里最值钱的一份凭据，在此之前它以明文
      经过 Cloudflare 和 nginx。mse.js 是从 server/web-shared/mse.ts 编出来的生成物
      （`node server/scripts/sync-mse-client.mjs`），不是手抄的第二份实现。

      单独一个文件而不是内联：这一页的 CSP 是 script-src 'self'，内联脚本会被拦掉。
      nginx 里有一条和 /console/login.js 完全对称的 location 放行它。
    -->
    <script src="/console/mse.js"></script>
    <script src="/console/login.js"></script>
  </body>
</html>
