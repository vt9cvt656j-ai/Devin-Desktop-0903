# Recover the visitor's real IP from Cloudflare.
#
# Cloudflare proxies every request to this origin, so `$remote_addr` is a Cloudflare edge
# address, not the person's. Two things were quietly broken by that:
#
#   * The Devices list showed a Cloudflare IP for every session, which is worthless for
#     the question it exists to answer — "is that login mine?".
#   * Worse, `LOGIN_FAIL_PER_IP` in the gateway keys its brute-force limiter on that same
#     address. With every visitor sharing a handful of edge IPs it was effectively ONE
#     global bucket: 50 failed logins anywhere on the internet locked every account out of
#     signing in for the rest of the hour, while giving a real attacker no per-source
#     limit at all.
#
# `set_real_ip_from` is an allow-list, and that is the whole security of this: the
# CF-Connecting-IP header is honoured only on connections that actually came from one of
# Cloudflare's published ranges. A direct hit on the origin cannot forge it.
#
# Refresh when Cloudflare publishes new ranges (rare — check https://www.cloudflare.com/ips):
#   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare sends the visitor's address here. Once this is set, $remote_addr and the
# X-Real-IP header the gateway reads both become the real client.
real_ip_header CF-Connecting-IP;
# Off: there is exactly one trusted proxy in front of this origin, and walking further
# back down X-Forwarded-For would start trusting hops the client can write.
real_ip_recursive off;
