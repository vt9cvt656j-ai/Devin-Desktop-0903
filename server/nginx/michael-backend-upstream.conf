# 后端上游。**这个文件由 deploy.sh 重写**——手工改的内容会在下一次蓝绿切换时被覆盖。
#
# 它存在的唯一理由，是把「流量指向哪个后端容器」变成一个可以**原子切换**的东西。
#
# 在这之前，部署是先毁后建：`up -d --build` 在确认新镜像跑得起来**之前**就销毁了正在
# 服务的容器。代价有两笔，线上日志里都量到了：
#   · 旧容器带着在途请求被停掉 → `upstream prematurely closed connection`
#     （2026-08-19 09:27 那次掐断的正是运营自己的一轮对话）
#   · 新容器起来之前的 1–2 秒 → `connect() failed (111)`，硬 502
#   两周共 1,499 次，其中 276 次是 /v1/chat/completions。**每一次都落在部署时刻，
#   日常运行零次**——这台机器的容量余量是 180 倍，它从来不是并发问题。
# 而且新版起不来时没有任何回滚可言：旧的已经没了。
#
# 现在的顺序是「先起新的 → 验康健 → 切这一行 → 最后停旧的」，任何一步失败旧容器都还在
# 服务。见 deploy.sh 的 rollout 段。
#
# 只有一个 server，是刻意的：同一时刻只有一种颜色收流量，不做双活。网关有进程内状态
# （线路冷却、卡死记号、思考钳位都是 per-process 的 HashMap），双活会让两个副本各学各的，
# 把「挂住的线路早点认输」退化成「每个副本各挂一次」。真要横向扩展，得先把那三份状态
# 挪到 Redis——它已经在跑了。以现在的量（峰值 45 次/分钟）没有这个必要。
#
# 也刻意不加 keepalive：那需要把 $connection_upgrade 的 "" 分支从 close 改成空串，
# 会牵扯 websocket 升级；而这是**回环**，握手成本是微秒级。收益不抵风险。
upstream michael_backend {
    server 127.0.0.1:8080;
}
