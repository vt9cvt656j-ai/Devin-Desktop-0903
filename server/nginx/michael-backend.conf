# Michael IDE gateway and admin application.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name code.mrday.one;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name code.mrday.one;

    ssl_certificate /etc/letsencrypt/live/code.mrday.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.mrday.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 55m;

    location /app/ {
        alias /var/www/michael-ide-app/;
        try_files $uri $uri/ /app/index.html;
    }

    location /s/ {
        alias /var/www/michael-sites/;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
