# Michael IDE gateway and admin application.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name code.mrday.one;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name code.mrday.one;

    ssl_certificate /etc/letsencrypt/live/code.mrday.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.mrday.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 55m;

    # Public login page for the web app (the ONLY thing an anonymous visitor can load).
    # Everything under /app/ requires a valid session cookie, so the frontend bundle,
    # its JS/CSS, and the tool UI are never downloadable without logging in.
    location = /gate {
        alias /var/www/michael-gate/gate.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Internal authz subrequest: validate the mide_token cookie by presenting it as a
    # Bearer to the backend /api/me (returns 200 for a valid login, 401 otherwise).
    location = /_app_authz {
        internal;
        proxy_pass http://127.0.0.1:8080/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer $cookie_mide_token";
    }


    # New React admin console, served ALONGSIDE the legacy one at / so the old path keeps
    # working until cutover. Auth is the app's own bearer token against /api/me — deliberately
    # no auth_request here, because that gate reads the mide_token cookie which the admin
    # console does not use. Fonts are self-hosted, so font-src stays 'self'.
    location /console/ {
        alias /var/www/michael-console/;
        try_files $uri $uri/ /console/index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /console/assets/ {
        alias /var/www/michael-console/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /app/ {
        auth_request /_app_authz;                 # gate: no valid session → 401 → redirect
        error_page 401 403 = @app_gate;
        alias /var/www/michael-ide-app/;
        try_files $uri $uri/ /app/index.html;
    }

    location @app_gate {
        return 302 /gate?next=$request_uri;
    }

    location /design-assets/ {
        alias /var/www/michael-design/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /s/ {
        alias /var/www/michael-sites/;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
