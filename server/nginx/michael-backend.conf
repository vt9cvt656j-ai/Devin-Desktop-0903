# Michael IDE gateway and admin application.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name code.mrday.one;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name code.mrday.one;

    ssl_certificate /etc/letsencrypt/live/code.mrday.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.mrday.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 55m;

    # 网页版 IDE。两件事**必须**跟着它一起上，否则这份配置就是一个无保护的实例：
    #
    # 1) auth_request 门禁。匿名连一个前端文件都不该下载到。生产上是有的
    #    （见 /_app_authz + @app_gate），但入库的这份此前没写，而 README 把它当标准
    #    安装步骤——照抄就等于把 IDE 直接敞开。
    # 2) CSP。桌面版的 CSP 写在 tauri.conf.json 里，那只管 Tauri WebView；网页版由
    #    nginx 下发，没有就等于**完全没有 CSP**。而 /app/ 下任意 XSS 都能读走
    #    mide_token（那个 cookie 刻意不是 HttpOnly，30 天有效期）。
    location = /_app_authz {
        internal;
        proxy_pass http://127.0.0.1:8080/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $cookie_mide_token";
    }

    location /app/ {
        auth_request /_app_authz;
        error_page 401 403 = @app_gate;
        alias /var/www/michael-ide-app/;
        try_files $uri $uri/ /app/index.html;

        # 与桌面版 tauri.conf.json 的 CSP 对齐。connect-src 需要 https: 以连本网关；
        # 没有 unsafe-inline / unsafe-eval。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @app_gate {
        return 302 /gate?next=$request_uri;
    }

    location /design-assets/ {
        alias /var/www/michael-design/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 用户部署的站点**不能**从这个 origin 提供服务。这里托管的是用户上传的任意
    # HTML/JS，一旦与网关/管理后台同源，站点里的一行脚本就能读走同源 localStorage
    # 里的 admin JWT，以及网页版门禁那个刻意设成非 HttpOnly 的 mide_token cookie
    # （两者都是 30 天有效期）→ 完全接管。管理员只要在自己域名下点开一次用户站点
    # 链接就中招，而"把部署链接发出去分享"本来就是这个功能的正常用途。
    #
    # 用户站点走独立 origin：michaelide-sites.conf 的 *.michaelide.xyz（deploy.rs
    # 的 assign_subdomain 建软链）。deploy.rs 已不再返回任何同源路径 URL。
    #
    # 保留 410 而不是直接删掉 location：老链接给出明确信号，也防止将来某次改动
    # 让它落到下面的 `location /` 反代进网关。
    location /s/ {
        return 410 "此路径已停用：用户站点请使用分配的 *.michaelide.xyz 子域名。";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
