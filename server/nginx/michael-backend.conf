# Michael IDE gateway and admin application.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name code.mrday.one;
    return 301 https://code.mrday.one$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name code.mrday.one;

    ssl_certificate /etc/letsencrypt/live/code.mrday.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.mrday.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 基线安全头。两个后台都有"点一下就生效"的破坏性按钮（改余额、删用户），不许被别的
    # 站点套进 iframe 里做点击劫持；X-Frame-Options 给老浏览器，CSP 的 frame-ancestors
    # 给新的。
    #
    # 注意：这一份**只对没有写自己 add_header 的 location 生效**（/app/、location /、
    # /api/auth/）。nginx 的 add_header 逐层覆盖，任何写了自己 add_header 的 location
    # 会把这五条全部丢掉 —— 所以下面每一个那样的 location 都要再 include 一次同一份。
    # 详见 snippets/michael-security-headers.conf 顶部实测到的丢失清单。
    include snippets/michael-security-headers.conf;

    # Recover the visitor's IP from Cloudflare before anything reads $remote_addr.
    # Without it the gateway's per-IP brute-force limiter was keyed on a Cloudflare edge
    # address — one shared bucket for the whole internet. See the snippet for detail.
    include snippets/cloudflare-real-ip.conf;
    client_max_body_size 55m;

    # 隐藏文件一律拒绝（.git/config、用户上传里的 .env 之类，之前是能直接取到的）。
    # .well-known 要放行，否则证书续签会断。
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
    disable_symlinks on;

    # Public login page for the web app (the ONLY thing an anonymous visitor can load).
    # Everything under /app/ requires a valid session cookie, so the frontend bundle,
    # its JS/CSS, and the tool UI are never downloadable without logging in.
    # 这一页此前一个安全头都没有 —— 只写了 Cache-Control，于是 server{} 那五条全被覆盖掉。
    # 它偏偏是匿名访客唯一打得开的页面，上面还摆着一个登录表单：没有 X-Frame-Options /
    # frame-ancestors，任何站点都能把它套进透明 iframe 做点击劫持。
    #
    # script-src 放了 'unsafe-inline'，因为 gate.html 的脚本是内联的（和 /console/login
    # 不同，那边刻意拆成了外部 login.js）。这不理想，但真正要挡的是"别的域的脚本"和
    # "被套进 iframe"，这两条这里都挡住了；等 gate.html 把脚本拆出去再收紧。
    location = /gate {
        alias /var/www/michael-gate/gate.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include snippets/michael-security-headers.conf;
    }

    # User-facing account app (React + Tailwind + shadcn, built from server/account-ui).
    # Two entry paths, one bundle. Gated by the same session check as /app/ — any
    # signed-in user, unlike /console/ which is admin-only via /_console_authz.
    location = /dashboard {
        auth_request /_app_authz;
        error_page 401 403 = @app_gate;
        alias /var/www/michael-account/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include snippets/michael-headers-account.conf;
    }

    # Plans, Stripe checkout and code redemption. Same gate: a buyer must be signed in
    # so the checkout session can be tied to their account.
    location = /billing {
        auth_request /_app_authz;
        error_page 401 403 = @app_gate;
        alias /var/www/michael-account/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include snippets/michael-headers-account.conf;
    }

    # The bundle. Gated too — and no-store rather than immutable for the same reason
    # spelled out for /console/assets/: Cloudflare sits in front, and anything it
    # caches is then served to anyone without ever asking the origin, which would make
    # the gate above decorative.
    location /account/ {
        auth_request /_app_authz;
        error_page 401 403 = @app_gate;
        alias /var/www/michael-account/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        include snippets/michael-headers-account.conf;
    }

    # Internal authz subrequest: validate the mide_token cookie by presenting it as a
    # Bearer to the backend (204 for a valid login, 401 otherwise).
    #
    # 打 /api/authz，**不是** /api/me。auth_request 是每个受门禁请求都触发一次，包括
    # /app/ 和 /account/ 下的每个 JS/CSS/字体；而 /api/me 每次要跑两条 UPDATE + 一条
    # 整行 SELECT（配额窗口刷新 + 每日免费点发放）。打开一次网页版 IDE 几十个静态
    # 资源，就是上百次对同一行 users 的写。
    #
    # 线上实测（2026-08-05）：users 表 120 行，累计 362,059 次 UPDATE，而 model_usage
    # 才 78,086 行 —— 绝大多数写入不来自计费，来自这道门禁。行锁让同一用户的并发请求
    # 串行化，日志里 `time to acquire exceeded slow threshold aquired_after_secs=2.29`
    # 就是连接卡在这上面。/api/authz 一次写都没有。
    location = /_app_authz {
        internal;
        proxy_pass http://127.0.0.1:8080/api/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer $cookie_mide_token";
    }


    # 管理后台门禁。
    #
    # 这里以前**没有任何**服务端鉴权：任何人 GET /console/ 都能拿到整个管理台的 HTML 和
    # JS，"你是不是管理员"完全靠访客自己浏览器里的一段 JS 判断。接口是有服务端鉴权的，
    # 所以不是直接的数据泄露，但等于把整张管理接口地图和一个登录表单公开挂在网上。
    #
    # 现在由 /api/admin/authz 判定：它读服务端下发的 HttpOnly cookie，回数据库查 role，
    # 只有 admin 才 204。不是管理员就一个字节都不发。
    location = /_console_authz {
        internal;
        proxy_pass http://127.0.0.1:8080/api/admin/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # 登录页本身必须对未登录的人开放，否则谁也进不来。它是一个独立的小页面，不含任何
    # 后台信息 —— 刻意不复用 SPA 的 index.html，否则 bundle 又变成公开可下载的了。
    # 精确匹配（=）优先级高于 /console/ 前缀匹配，所以这两条不会被门禁挡住。
    location = /console/login {
        alias /var/www/michael-console-login/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include snippets/michael-security-headers.conf;
    }

    location = /console/login.js {
        alias /var/www/michael-console-login/login.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include snippets/michael-security-headers.conf;
    }

    # 登录页要显示的 logo。一个图标不敏感，放在门禁外面。
    location = /console/logo.png {
        alias /var/www/michael-console/logo.png;
        expires 1d;
        include snippets/michael-security-headers.conf;
    }

    # 字体也放在门禁外面：登录页要用 Space Grotesk / Inter 才能和后台里那一屏长得一样，
    # 而它没登录时取不到门禁后的东西。字体文件本身不含任何信息。
    # 前缀更长，优先级高于下面的 /console/ 块。
    location /console/fonts/ {
        alias /var/www/michael-console/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/michael-security-headers.conf;
    }

    location /console/ {
        auth_request /_console_authz;
        error_page 401 403 = @console_gate;
        alias /var/www/michael-console/;
        try_files $uri $uri/ /console/index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include snippets/michael-security-headers.conf;
        # 后台页面不进缓存：换人登录不该还能按后退键翻出上一个人的界面。
        add_header Cache-Control "no-store" always;
    }

    # bundle 必须和页面一起挡。少了这一条，/console/ 挡住了也没用 —— 直接取
    # /console/assets/index-*.js 一样能把整个管理台拉走。
    #
    # no-store，不是 private/immutable：这台机器前面有 Cloudflare。源站的门禁只在
    # 请求真的回源时才生效，而 CDN 一旦把某个 URL 缓存下来，之后就直接从边缘发给任何人，
    # 根本不会来问源站。之前 bundle 带的是 `public, immutable, 30 天`，Cloudflare 照单
    # 全收，于是门禁上线之后旧 bundle 仍然对匿名用户 200 —— 门等于没关。
    # 受门禁保护的东西一律不许进任何缓存。就一个运营在用，缓存本来也没什么价值。
    location /console/assets/ {
        auth_request /_console_authz;
        error_page 401 403 = @console_gate;
        alias /var/www/michael-console/assets/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        include snippets/michael-security-headers.conf;
    }

    location @console_gate {
        return 302 /console/login?next=$request_uri;
    }

    # 这里**故意**不写 add_header：一条都不写，才能整份继承 server{} 那五条基线头
    # （实测确认五条都在）。一旦要给它加 CSP，就必须同时 include 基线，否则五条全丢。
    #
    # CSP 暂缺，而且是个有意的决定：这一屏是 Monaco + xterm + 若干 worker，还要预览
    # markdown / 图片 / PDF。写一条真正收紧的 CSP 不难，难的是**验证**——它在
    # /_app_authz 后面，要一个真实会话才打得开，改错了是线上用户白屏，而不是我这边报错。
    # 等能在浏览器里带会话跑一遍再补。基线五条（含 X-Frame-Options: DENY）此刻是全的。
    location /app/ {
        auth_request /_app_authz;                 # gate: no valid session → 401 → redirect
        error_page 401 403 = @app_gate;
        alias /var/www/michael-ide-app/;
        try_files $uri $uri/ /app/index.html;
    }

    location @app_gate {
        return 302 /gate?next=$request_uri;
    }

    location /design-assets/ {
        alias /var/www/michael-design/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include snippets/michael-security-headers.conf;
    }

    # 这里原先有一条 `location /s/ { alias /var/www/michael-sites/; }`，把**用户上传的
    # 任意 HTML/JS** 挂在了网关和管理后台的同一个 origin 上。任何注册用户传一个带脚本的
    # 静态站，那段脚本就和 /console/ 同源运行，能直接读走 localStorage 里的管理员令牌和
    # 非 HttpOnly 的 mide_token —— 同源的脚本能绕过任何门禁，这是整套系统里最短的一条
    # 接管路径。deploy.rs 早就拒绝再生成 /s/ 链接并把原因写在注释里，只有这条 nginx
    # 路由留了下来。用户站点在 michaelide-sites.conf 里有自己的独立域名，不需要它。
    #
    # 别再加回来。

    # 登录接口单独限速：每次登录要跑一次 bcrypt（约 250ms CPU），不限速的话，一台机器
    # 就能把 CPU 打满，顺带无限次试密码、刷兑换码。
    location ~ ^/api/auth/ {
        limit_req zone=mdo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 刻意**不**在这里加 limit_req / limit_conn：这是中转本身的路径，长连接、流式、
    # 一个用户同时开多个会话都是正常的，办公室共用一个出口 IP 更是常态。在这里限流
    # 等于随机掐断付费用户的请求 —— 比它挡下的风险更贵。限速只加在登录这种
    # 「一次请求烧掉一次 bcrypt」的地方。
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
