# 账户前台（/dashboard、/billing、/account/）的响应头。
# 装到 /etc/nginx/snippets/michael-headers-account.conf。
#
# 三个 location 是同一个 SPA 的三个入口，CSP 必须逐字一致 —— 分三处手写迟早会漂。
#
# 它是 Vite 构建：脚本全部是 /account/assets/ 下的外部 module，所以 script-src 收到
# 'self' 就够，不需要 'unsafe-inline'。style 留 'unsafe-inline'，React 会往元素上写
# 内联 style。connect-src 放 https:，因为结算要打网关和 Stripe。
#
# form-action 'self' 不影响 Stripe Checkout：那是 JS 改 location 的导航，不是表单提交。

# static.cloudflareinsights.com 是唯一放行的第三方脚本源。Cloudflare 的 Web Analytics
# 会自动往页面里注入 beacon.min.js，被 script-src 'self' 挡掉后每次加载都在控制台报一条
# CSP 违规。
#
# 放行它不降低这个页面的安全性：Cloudflare 是这个站点的 CDN，TLS 在它那里终止，明文流量
# 本来就经过它 —— 再挡它自己的脚本换不来任何实际收益。卡号也不在这个页面上，Stripe
# Checkout 是托管页。
#
# 如果不想要分析数据，更干净的做法是在 Cloudflare 后台关掉 Web Analytics，然后把这一项
# 从 script-src 去掉 —— 支付页面本来就不需要第三方脚本。
include snippets/michael-security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
