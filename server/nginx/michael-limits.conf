# 限流区。必须放在 http{} 里 —— 装到 /etc/nginx/conf.d/michael-limits.conf。
# michael-backend.conf 是 server{} 级的文件，声明不了 zone。
#
# 只给登录路径限速。中转本身（location /）刻意不限：长连接、流式响应、一个用户开多个
# 会话都是正常流量，办公室共用出口 IP 更是常态，在那里限流等于随机掐断付费请求。
#
# 10r/m + burst=5：正常人登录一次就进去了，打错几次也够用；但把一次登录要跑的 bcrypt
# （约 250ms CPU）从"无限次"压到了每分钟十来次，撞库和 CPU 打满都不成立了。
# 服务端另有按账号/按 IP 的失败锁定（auth.rs），这一层是它前面的粗筛。
limit_req_zone $binary_remote_addr zone=mdo_auth:10m rate=10r/m;

# 暂时没有用到的连接数区，留着以备给非中转路径使用。
limit_conn_zone $binary_remote_addr zone=mdo_perip:10m;

# 被限速时回 429 而不是默认的 503：客户端能分清"你太快了"和"服务挂了"。
limit_req_status 429;
limit_conn_status 429;

# 不在响应头和错误页里报自己的版本号。此前每一个 302／404／502 的页脚都写着
# "nginx/1.18.0 (Ubuntu)"，等于告诉扫描器该拿哪一年的漏洞清单来试——匿名请求
# /console/ 拿到的那张跳转页就带着它。
#
# 放在这里而不是 /etc/nginx/nginx.conf：那个文件不在仓库里，改了下次覆盖就没了；
# conf.d/ 下的这份是随仓库部署的，而 server_tokens 是 http{} 级指令，在这里生效范围
# 和写在 nginx.conf 里完全一样。
server_tokens off;
