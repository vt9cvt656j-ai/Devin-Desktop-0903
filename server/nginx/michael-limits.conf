# 限流区。必须放在 http{} 里 —— 装到 /etc/nginx/conf.d/michael-limits.conf。
# michael-backend.conf 是 server{} 级的文件，声明不了 zone。
#
# 只给登录路径限速。中转本身（location /）刻意不限：长连接、流式响应、一个用户开多个
# 会话都是正常流量，办公室共用出口 IP 更是常态，在那里限流等于随机掐断付费请求。
#
# 10r/m + burst=5：正常人登录一次就进去了，打错几次也够用；但把一次登录要跑的 bcrypt
# （约 250ms CPU）从"无限次"压到了每分钟十来次，撞库和 CPU 打满都不成立了。
# 服务端另有按账号/按 IP 的失败锁定（auth.rs），这一层是它前面的粗筛。
limit_req_zone $binary_remote_addr zone=mdo_auth:10m rate=10r/m;

# 第三方登录（GitHub / Google）单独一档，比上面宽。
#
# 它不跑 bcrypt：/providers 只读两个配置项，/start 只签一个 JWT，/callback 花的是等
# 对方服务器的时间而不是本机 CPU。可它们又都挂在 /api/auth/ 下面，如果共用 10r/m：
#   * /gate 每打开一次就问一次 /providers，刷几次页面就把额度耗在这上面，
#     真正要登录的那次反而被 429；
#   * 更糟的是 /callback —— 人已经在 GitHub 上点了同意才跳回来，这一下被限流，
#     等于授权完了却登不进来，而且重试要从头再授权一遍。
# 60r/m + burst 20：正常使用碰不到，被人拿去当跳板刷对方接口时仍然有上限。
limit_req_zone $binary_remote_addr zone=mdo_oauth:10m rate=60r/m;

# 暂时没有用到的连接数区，留着以备给非中转路径使用。
limit_conn_zone $binary_remote_addr zone=mdo_perip:10m;

# 被限速时回 429 而不是默认的 503：客户端能分清"你太快了"和"服务挂了"。
limit_req_status 429;
limit_conn_status 429;

# 不在响应头和错误页里报自己的版本号。此前每一个 302／404／502 的页脚都写着
# "nginx/1.18.0 (Ubuntu)"，等于告诉扫描器该拿哪一年的漏洞清单来试——匿名请求
# /console/ 拿到的那张跳转页就带着它。
#
# 放在这里而不是 /etc/nginx/nginx.conf：那个文件不在仓库里，改了下次覆盖就没了；
# conf.d/ 下的这份是随仓库部署的，而 server_tokens 是 http{} 级指令，在这里生效范围
# 和写在 nginx.conf 里完全一样。
server_tokens off;

# ---------------------------------------------------------------------------
# 压缩。和 server_tokens 同理放在这里：nginx.conf 不在仓库里，改了下次覆盖就没了，
# 而 gzip_* 是 http{} 级指令，写在 conf.d/ 下生效范围完全一样。
#
# 线上 nginx.conf 里 `gzip on` 是开着的，但 `gzip_types` 整行被注释掉了 —— nginx 的默认
# 值是 `text/html` **一种**，所以除了 HTML 之外一个字节都没压过。2026-08-22 实测：
#   · /api/tools/catalog → application/json、content-length 2144、无 content-encoding
#   · /api/models        → application/json、content-length 10400、无 content-encoding
#   · /gate（text/html） → content-encoding: gzip   ← 唯一被压的
#   · /var/www/michael-ide-app/assets 19.4MB 的 JS（ts.worker 6.9M、main 4.7M、
#     editor.api2 3.7M、vendor 2.4M）全部裸传，网页版每次冷加载就是这个数。
# 两周日志里 /api/knowledge/search 平均每次 12,609 字节 × 11,546 次。
#
# **刻意不列 text/event-stream**：那是流式对话（models.rs 的 SSE 响应）。proxy_buffering
# off 时 gzip 过滤器会按块 Z_SYNC_FLUSH，不会把流卡住，但 SSE 里都是短增量帧，压缩率接近
# 于零而每帧多一次 deflate —— 纯浪费 CPU。
# **刻意不列 application/mse-sealed**：MSE 密文（mse.rs），已经是高熵数据，压不动。
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;

# 小响应压了反而更大（gzip 头 + 尾就 20 字节上下），而且白烧 CPU。
gzip_min_length 256;

# 5 是 CPU/压缩率的拐点；6 以上对 JS/JSON 只多几个百分点，CPU 却明显上去。
gzip_comp_level 5;

# 被代理的响应也压 —— 网关的 JSON 全部来自 proxy_pass，不写这条它们一个都不会被压。
gzip_proxied any;

# 必须有：同一个 URL 会同时存在压缩和未压缩两个版本，中间任何缓存（含浏览器自己）
# 必须按 Accept-Encoding 分开存，否则会把 gzip 的字节发给不支持的客户端。
gzip_vary on;

# 预压缩优先：发布脚本会在 rsync 之前生成 .gz，命中时 nginx 直接发文件、零 CPU；
# 没有 .gz 或客户端不接受 gzip 时自动回退到原文件。
#
# ⚠️ 这一条**需要 ngx_http_gzip_static_module**，而它不是默认编进去的。缺了它 nginx
# 不是忽略这行，是 `unknown directive "gzip_static"` **直接起不来** —— 一条为了省 CPU
# 加的指令能把整台机器打成 502。上线这台已经核过：
#   nginx -V 2>&1 | tr ' ' '\n' | grep gzip   →  --with-http_gzip_static_module
#   nginx/1.18.0 (Ubuntu)，2026-08-22 实测。
# 换机器 / 换发行版 / 自编译 nginx 时先跑一遍这条命令再照抄这个文件。
gzip_static on;
