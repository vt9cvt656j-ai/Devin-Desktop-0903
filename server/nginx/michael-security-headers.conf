# 安全响应头基线。装到 /etc/nginx/snippets/michael-security-headers.conf。
#
# ## 为什么必须是一个 include，而不是写在 server{} 里一次
#
# nginx 的 add_header 是**逐层覆盖**，不是累加：只要某个 location 里出现了任何一条
# add_header，它就完全不继承 server{} 那一层的 add_header —— 一条都不继承。
#
# 这条规则此前正在生效，而且是静默的。实测（2026-08-04）：
#
#   /gate            → 一个安全头都没有。它只写了 Cache-Control，于是 HSTS、nosniff、
#                      X-Frame-Options、Referrer-Policy、Permissions-Policy 五条全丢。
#                      而这是**匿名访客唯一能打开的页面**，上面还摆着一个登录表单 ——
#                      没有 X-Frame-Options 就意味着它可以被任意站点套进 iframe 点击劫持。
#   /console/login.js → 只剩 nosniff
#   /console/logo.png → 只剩 nosniff
#   /design-assets/   → 丢了 X-Frame-Options 和 Permissions-Policy
#
# 反过来，/app/ 和 location / 因为**一条 add_header 都没写**，反而完整继承了五条。
# 也就是说：越是精心配置的 location，安全头掉得越干净。这正是这个陷阱阴险的地方。
#
# 所以基线放进这个文件，每个写了自己 add_header 的 location 都 include 一次。加新
# location 时只要跟着 include，就不会再漏。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
