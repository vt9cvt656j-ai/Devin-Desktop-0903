# Static user deployments on <name>.michaelide.xyz.

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<sub>[a-z0-9-]+)\.michaelide\.xyz$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<sub>[a-z0-9-]+)\.michaelide\.xyz$;

    ssl_certificate /etc/letsencrypt/live/michaelide.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelide.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # SAMEORIGIN 而不是 DENY：这些是用户自己的站点，把自己的页面嵌进自己的页面是正当用法，
    # DENY 会把它们一起挡掉。要防的是**别人**拿它做点击劫持，SAMEORIGIN 就够。
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 刻意不下发 CSP：这里是用户上传的任意静态站，各自要加载什么第三方资源无法预先知道，
    # 统一发一条 CSP 等于随机弄坏别人的站。跨站隔离靠的是每个站独立的子域 origin
    # （这正是当初把 /s/ 从网关域名下拆走的原因），不是 CSP。

    # 主配置里有这两条，这份没有 —— 而这里服务的恰恰是**用户上传的内容**。用户打包时
    # 带进来一个 .env、.git/config 或 .DS_Store，此前就直接公开可取了。deploy.rs 在解压
    # 阶段挡住了 ../、软硬链接和设备文件，但没有挡点开头的文件名。
    # .well-known 要放行，否则这个域的证书续签会断。
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # 这里**不能**开 disable_symlinks —— 主配置里有那一条，照抄过来会把所有租户站打死。
    # 子域到账号目录的映射本身就是软链接：
    #   _hosts/qqrev -> /var/www/michael-sites/<account-uuid>/qqrev
    # 开了就等于禁掉这套映射（实测：qqrev 立刻 404，只有恰好是真实目录的 www 还活着）。
    #
    # 少了它也不会变成穿越漏洞：这些软链接是网关自己按账号建的，不是用户能控制的内容，
    # 而 deploy.rs 在解压阶段就拒收压缩包里的软链接/硬链接/设备文件，用户塞不进来一条。

    root /var/www/michael-sites/_hosts/$sub;
    index index.html;

    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        try_files /index.html =404;
    }

    access_log /var/log/nginx/michaelide-sites.access.log;
    error_log /var/log/nginx/michaelide-sites.error.log;
}
