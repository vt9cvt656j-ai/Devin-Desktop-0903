# Static user deployments on <name>.michaelide.xyz.

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<sub>[a-z0-9-]+)\.michaelide\.xyz$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<sub>[a-z0-9-]+)\.michaelide\.xyz$;

    ssl_certificate /etc/letsencrypt/live/michaelide.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelide.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/michael-sites/_hosts/$sub;
    index index.html;

    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        try_files /index.html =404;
    }

    access_log /var/log/nginx/michaelide-sites.access.log;
    error_log /var/log/nginx/michaelide-sites.error.log;
}
