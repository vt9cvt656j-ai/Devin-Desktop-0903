# The official website, served from the apex mrday.one.
#
# It used to live at www.michaelide.xyz, which is now a redirect (see the last block).
# That domain still hosts something else entirely and is NOT being retired: every site a
# user publishes from the IDE gets <name>.michaelide.xyz, covered by the wildcard
# certificate and driven by DEPLOY_SITE_DOMAIN. Those two things share a domain by
# history, not by design — moving the marketing site off it is what separates them.
#
# The content root is the same directory the site was already being served from, so this
# changes the address in front of it, not the files behind it.

server {
    listen 80;
    listen [::]:80;
    server_name mrday.one www.mrday.one;

    # Must come before the redirect below, and must stay reachable over plain HTTP.
    #
    # The default :80 server sends everything to code.mrday.one. A certificate renewal
    # that followed that redirect would land on a host which has never heard of the
    # challenge token, and the renewal would fail — quietly, sixty days from now, long
    # after anyone remembered why. `^~` stops nginx considering any regex location for
    # this prefix, so nothing added later can shadow it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        # To the apex, not $host: www.mrday.one has no DNS record today, so sending
        # someone there would be a dead end rather than a redirect.
        return 301 https://mrday.one$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrday.one;

    ssl_certificate /etc/letsencrypt/live/mrday.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrday.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # index.html names the hashed bundle, so a browser holding an old copy keeps loading
    # old assets — every deploy silently missed anyone who had visited before, and the
    # only workaround was telling people to hard-reload. "no-cache" still allows the
    # ETag revalidation below, so this costs one 304 per visit, not a re-download.
    add_header Cache-Control "no-cache" always;

    # Deliberately no CSP, matching the tenant-site config: this page is built and
    # published by hand and pulls in whatever the current build references. A CSP written
    # here would be guessing at that and would break the site on the next rebuild, which
    # is worse than not having one on a page that takes no input and holds no session.

    # Dotfiles are not served — a build that happens to carry a .env or a .git directory
    # would otherwise be publicly readable. .well-known stays open for renewals.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    root /var/www/michael-sites/_hosts/www;
    index index.html;

    # The build content-hashes every asset filename, so a given URL's bytes never change:
    # these can be cached hard and forever, which is what keeps "no-cache" on the HTML
    # cheap — the page revalidates, the megabytes do not.
    #
    # The security headers are repeated because nginx does not merge `add_header`: a
    # location that sets any header replaces the whole inherited set, so omitting them
    # here would quietly drop HSTS and the rest for every script, stylesheet and image.
    location ^~ /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/mrday-site.access.log;
    error_log /var/log/nginx/mrday-site.error.log;
}

# The old address. A redirect rather than a second copy: two live addresses for one site
# means whichever one someone links to is a coin flip, and search engines split the
# credit between them.
#
# An exact server_name beats the ~^(?<sub>...)\.michaelide\.xyz$ regex in the tenant
# config no matter which file loads first, so this wins for www and leaves every other
# subdomain — including the user-published sites — untouched.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.michaelide.xyz;

    ssl_certificate /etc/letsencrypt/live/michaelide.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelide.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 301, so browsers and crawlers treat the move as permanent and pass the history of
    # the old address to the new one. $request_uri keeps deep links working: the download
    # anchor the console points at survives as https://mrday.one/#download.
    return 301 https://mrday.one$request_uri;
}
