<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Michael 总后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f8f9fa; --surface:#ffffff; --text:#202124; --dim:#5f6368;
    --line:#dadce0; --hover:#f1f3f4; --accent:#1a73e8; --accent-d:#1765cc;
    --green:#1e8e3e; --red:#d93025; --amber:#f9ab00;
    --shadow1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
    --shadow2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
    --sidebar-w:236px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 "Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .hidden{display:none!important}
  .material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:'opsz' 20}

  /* ---------- login ---------- */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 40px;width:400px;max-width:100%;box-shadow:var(--shadow1);text-align:center}
  .glogo{width:46px;height:46px;margin:0 auto 18px;display:block}
  .card h1{margin:0 0 6px;font-size:22px;font-weight:500}
  .card .sub{margin:0 0 26px;color:var(--dim);font-size:14px}
  .field{margin-bottom:18px;text-align:left}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
  input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;text-align:left}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:12px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,box-shadow .15s}
  button.primary:hover{background:var(--accent-d);box-shadow:var(--shadow1)}
  button.primary:disabled{opacity:.6;cursor:default;box-shadow:none}

  /* ---------- app shell ---------- */
  .app{display:flex;height:100vh;overflow:hidden}
  /* sidebar */
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px;height:64px;border-bottom:1px solid var(--line)}
  .sb-brand svg{width:26px;height:26px}
  .sb-brand b{font-size:16px;font-weight:500}
  .nav{flex:1;overflow:auto;padding:10px 10px}
  .nav-item{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:24px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;user-select:none;transition:background .12s,color .12s}
  .nav-item:hover{background:var(--hover);color:var(--text)}
  .nav-item.active{background:#e8f0fe;color:var(--accent)}
  .nav-item .material-symbols-outlined{font-size:20px}
  .sb-foot{border-top:1px solid var(--line);padding:12px 16px}
  .sb-foot .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);margin-bottom:10px;overflow:hidden}
  .sb-foot .who .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:500;flex:0 0 30px;text-transform:uppercase}
  .sb-foot .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logout{width:100%;background:transparent;border:1px solid var(--line);color:var(--accent);padding:8px;border-radius:20px;font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
  .logout:hover{background:var(--hover)}

  /* main: tabbar + content */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .tabbar{display:flex;align-items:flex-end;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 8px;height:46px;overflow-x:auto}
  .tab{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-top:6px;border-radius:8px 8px 0 0;color:var(--dim);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;border-bottom:none;position:relative;top:1px}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);color:var(--accent);border-color:var(--line)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
  .tab .material-symbols-outlined{font-size:18px}
  .tab .x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:16px;line-height:1}
  .tab .x:hover{background:rgba(0,0,0,.1)}
  .content{flex:1;overflow:auto}
  .page{padding:26px 28px;max-width:1180px;margin:0 auto}
  .page h3.ptitle{margin:0 0 4px;font-size:22px;font-weight:500}
  .page p.pdesc{margin:0 0 22px;color:var(--dim);font-size:14px}

  /* shared widgets */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;transition:box-shadow .15s}
  .stat:hover{box-shadow:var(--shadow1)}
  .stat b{display:block;font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat span{color:var(--dim);font-size:13px}
  .stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .box h2{margin:0;padding:16px 20px;font-size:13px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(30,142,62,.5);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(30,142,62,0)}100%{box-shadow:0 0 0 0 rgba(30,142,62,0)}}
  .feed{max-height:460px;overflow:auto;margin:0;padding:4px 0;list-style:none}
  .feed li{padding:11px 20px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:11px;align-items:baseline}
  .feed li:last-child{border-bottom:0}
  .feed li:hover{background:var(--hover)}
  .tag{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--hover);color:var(--dim);white-space:nowrap;font-weight:500}
  .tag.register{background:#e6f4ea;color:var(--green)}
  .tag.login{background:#e8f0fe;color:var(--accent)}
  .tag.role_change{background:#fef7e0;color:#b06000}
  .tag.redeem{background:#e6f4ea;color:var(--green)}
  .tag.grant{background:#f3e8fd;color:#8430ce}
  .plan-badge{font-size:11px;padding:2px 9px;border-radius:12px;background:#f3e8fd;color:#8430ce;font-weight:500}
  .codeval{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
  .gen-form{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .gen-form select,.gen-form input{width:auto;min-width:90px}
  .gen-form input.note{min-width:160px}
  .feed .t{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input{width:280px}
  .btn{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
  .btn:hover{background:var(--hover)}
  .btn.b{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.b:hover{background:var(--accent-d)}
  .btn.danger{color:var(--red);border-color:#f3c0bd}
  .btn.danger:hover{background:#fce8e6}
  .btn.sm{padding:4px 12px;font-size:12px}
  .count{color:var(--dim);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
  th,td{text-align:left;padding:12px 20px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--hover)}
  th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td.email{font-weight:500}
  .role{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--hover);color:var(--dim);font-weight:500}
  .role.admin{background:#e8f0fe;color:var(--accent)}
  .muted{color:var(--dim);padding:18px 20px;font-size:14px}
  .t{color:var(--dim)}
  .acts{display:flex;gap:8px}
  /* placeholder */
  .ph{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:54px 24px;text-align:center;color:var(--dim)}
  .ph .material-symbols-outlined{font-size:48px;color:var(--accent);opacity:.5}
  .ph h4{margin:14px 0 6px;color:var(--text);font-size:18px;font-weight:500}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;box-shadow:var(--shadow2);z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <!-- login -->
  <div class="login" id="loginView">
    <div class="card">
      <svg class="glogo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <h1>Michael 总后台</h1>
      <p class="sub">管理员登录</p>
      <div class="err" id="loginErr"></div>
      <div class="field"><label for="email">账号</label><input id="email" type="text" placeholder="请输入账号" autocomplete="username" /></div>
      <div class="field"><label for="password">密码</label><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" /></div>
      <button class="primary" id="loginBtn">登录</button>
    </div>
  </div>

  <!-- app shell -->
  <div class="app hidden" id="appView">
    <aside class="sidebar">
      <div class="sb-brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <b>Michael 总后台</b>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-foot">
        <div class="who"><span class="av" id="avatar">A</span><span id="who"></span></div>
        <button class="logout" id="logoutBtn">退出登录</button>
      </div>
    </aside>
    <div class="main">
      <div class="tabbar" id="tabbar"></div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "michael_admin_token";
let token = localStorage.getItem(TOKEN_KEY) || "";
let ws = null, statsTimer = null, me = null, usersCache = [];

/* ---------- module registry ---------- */
const MODULES = {
  dashboard: { title: "仪表盘",     icon: "dashboard", render: renderDashboard, mount: mountDashboard },
  users:     { title: "用户管理",   icon: "group",     render: renderUsers,     mount: mountUsers },
  codes:     { title: "激活码系统", icon: "vpn_key",   render: renderCodes,     mount: mountCodes },
  email:     { title: "邮箱通知系统", icon: "mail",    render: renderEmail,     mount: mountEmail },
  pay:       { title: "支付系统",   icon: "payments",  render: renderPay,       mount: mountPay },
  models:    { title: "模型系统",   icon: "smart_toy", render: renderModels,    mount: mountModels },
};
const ORDER = ["dashboard","users","codes","email","pay","models"];
let openTabs = [], activeTab = null;

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401 || res.status === 403) { if(path!=="/api/me") toast("登录已失效"); logout(); throw new Error("未授权"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}
function show(view){ $("loginView").classList.toggle("hidden", view!=="login"); $("appView").classList.toggle("hidden", view!=="app"); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(ts){ if(!ts) return ""; const d=new Date(ts); return isNaN(d)?"":d.toLocaleString("zh-CN",{hour12:false}); }

/* ---------- login ---------- */
$("loginBtn").addEventListener("click", doLogin);
$("password").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
$("email").addEventListener("keydown", (e)=>{ if(e.key==="Enter") $("password").focus(); });
async function doLogin(){
  const email=$("email").value.trim(), password=$("password").value;
  const btn=$("loginBtn"); $("loginErr").textContent="";
  if(!email||!password) return;
  btn.disabled=true; btn.textContent="登录中…";
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const b=await r.json();
    if(!r.ok) throw new Error(b.error||"登录失败");
    if(b.user.role!=="admin") throw new Error("该账号不是管理员");
    token=b.token; localStorage.setItem(TOKEN_KEY,token);
    enterApp(b.user);
  }catch(e){ $("loginErr").textContent=e.message||String(e); }
  finally{ btn.disabled=false; btn.textContent="登录"; }
}
function logout(){
  token=""; localStorage.removeItem(TOKEN_KEY);
  if(ws){ try{ws.close();}catch{} ws=null; }
  if(statsTimer){ clearInterval(statsTimer); statsTimer=null; }
  openTabs=[]; activeTab=null;
  show("login");
}
$("logoutBtn").addEventListener("click", logout);

/* ---------- app shell ---------- */
function enterApp(user){
  me=user;
  $("who").textContent=user.email;
  $("avatar").textContent=(user.email||"A").slice(0,1);
  buildNav();
  show("app");
  openTab("dashboard");
  connectWs();
  statsTimer=setInterval(refreshStats,15000);
}
function buildNav(){
  $("nav").innerHTML = ORDER.map(k=>`<div class="nav-item" data-k="${k}"><span class="material-symbols-outlined">${MODULES[k].icon}</span>${MODULES[k].title}</div>`).join("");
  $("nav").querySelectorAll(".nav-item").forEach(el=>el.addEventListener("click",()=>openTab(el.dataset.k)));
}
function openTab(key){
  if(!openTabs.includes(key)) openTabs.push(key);
  activeTab=key;
  renderTabs(); renderContent();
}
function closeTab(key,ev){
  if(ev) ev.stopPropagation();
  const i=openTabs.indexOf(key); if(i<0) return;
  openTabs.splice(i,1);
  if(activeTab===key) activeTab=openTabs[Math.max(0,i-1)]||openTabs[0]||null;
  renderTabs(); renderContent();
}
function renderTabs(){
  $("tabbar").innerHTML = openTabs.map(k=>`<div class="tab ${k===activeTab?"active":""}" data-k="${k}"><span class="material-symbols-outlined">${MODULES[k].icon}</span>${MODULES[k].title}<span class="x" data-x="${k}">&times;</span></div>`).join("");
  $("tabbar").querySelectorAll(".tab").forEach(el=>{
    el.addEventListener("click",()=>{ activeTab=el.dataset.k; renderTabs(); renderContent(); });
    el.querySelector(".x").addEventListener("click",(e)=>closeTab(el.dataset.x,e));
  });
  $("nav").querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.k===activeTab));
}
function renderContent(){
  const c=$("content");
  if(!activeTab){ c.innerHTML='<div class="page"><div class="ph"><span class="material-symbols-outlined">tab</span><h4>没有打开的标签页</h4><p>点击左侧菜单打开一个模块</p></div></div>'; return; }
  const m=MODULES[activeTab];
  c.innerHTML=m.render();
  try{ m.mount(); }catch(e){ console.error(e); }
}
function ph(icon,title,desc){
  return `<div class="page"><h3 class="ptitle">${esc(title)}</h3><p class="pdesc">${esc(desc)}</p><div class="ph"><span class="material-symbols-outlined">${icon}</span><h4>功能开发中</h4><p>${esc(desc)}</p></div></div>`;
}

/* ---------- module: dashboard ---------- */
function renderDashboard(){
  return `<div class="page">
    <h3 class="ptitle">仪表盘</h3><p class="pdesc">平台总览与实时动态</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">—</b><span>总用户</span></div>
      <div class="stat"><b id="sToday">—</b><span>今日新增</span></div>
      <div class="stat"><b id="sOnline">—</b><span><span class="dot"></span>当前在线</span></div>
    </div>
    <div class="grid">
      <div class="box"><h2><span class="live"></span> 实时动态</h2><ul class="feed" id="feed"><li class="muted">等待事件…</li></ul></div>
      <div class="box"><h2>最近用户</h2><div id="dashUsers"><div class="muted">加载中…</div></div></div>
    </div></div>`;
}
function mountDashboard(){ refreshStats(); loadRecentEvents(); refreshDashUsers(); }
async function refreshStats(){
  if(!$("sTotal")) return;
  try{ const s=await api("/api/admin/stats"); if($("sTotal")){ $("sTotal").textContent=s.total_users; $("sToday").textContent=s.today_users; $("sOnline").textContent=s.online; } }catch{}
}
async function loadRecentEvents(){
  try{
    const evs=await api("/api/admin/events"); const feed=$("feed"); if(!feed) return; feed.innerHTML="";
    evs.slice().reverse().forEach(e=>addEvent({kind:e.kind,data:e.data,user_id:e.user_id,ts:e.created_at}));
    if(!feed.children.length) feed.innerHTML='<li class="muted">暂无动态</li>';
  }catch{}
}
async function refreshDashUsers(){
  try{
    const users=await api("/api/admin/users"); usersCache=users; const w=$("dashUsers"); if(!w) return;
    if(!users.length){ w.innerHTML='<div class="muted">暂无用户</div>'; return; }
    const rows=users.slice(0,8).map(u=>`<tr><td class="email">${esc(u.email)}</td><td><span class="role ${u.role==="admin"?"admin":""}">${esc(u.role)}</span></td><td class="t">${fmt(u.created_at)}</td></tr>`).join("");
    w.innerHTML=`<table><thead><tr><th>账号</th><th>角色</th><th>注册时间</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch{}
}
function addEvent(e){
  const feed=$("feed"); if(!feed) return;
  if(feed.querySelector(".muted")) feed.innerHTML="";
  const li=document.createElement("li");
  const who=(e.data&&e.data.email)?e.data.email:(e.user_id||"");
  const label=e.kind==="register"?"注册":e.kind==="login"?"登录":e.kind==="role_change"?"角色变更":e.kind==="redeem"?"兑换":e.kind==="grant"?"开通":e.kind==="notify"?"通知":e.kind==="order_created"?"下单":e.kind==="order_paid"?"支付":e.kind;
  li.innerHTML=`<span class="tag ${esc(e.kind)}">${esc(label)}</span><span>${esc(who)}</span><span class="t">${fmt(e.ts)}</span>`;
  feed.prepend(li);
  while(feed.children.length>60) feed.removeChild(feed.lastChild);
}

/* ---------- module: users ---------- */
function renderUsers(){
  return `<div class="page">
    <h3 class="ptitle">用户管理</h3><p class="pdesc">查看、调整角色与删除用户</p>
    <div class="toolbar">
      <input id="userSearch" placeholder="搜索账号 / 邮箱…" />
      <button class="btn" id="userReload">刷新</button>
      <span class="count" id="userCount"></span>
    </div>
    <div class="box"><div id="usersTable"><div class="muted">加载中…</div></div></div></div>`;
}
function mountUsers(){
  loadUsers();
  $("userReload").addEventListener("click", loadUsers);
  $("userSearch").addEventListener("input", ()=>renderUsersTable($("userSearch").value.trim().toLowerCase()));
}
async function loadUsers(){
  try{ usersCache=await api("/api/admin/users"); renderUsersTable(($("userSearch")?$("userSearch").value.trim().toLowerCase():"")); }
  catch(e){ if($("usersTable")) $("usersTable").innerHTML=`<div class="muted">加载失败：${esc(e.message)}</div>`; }
}
function usd(cents){ return "$"+((cents||0)/100).toFixed(2); }
function planCell(u){
  if(!u.plan||u.plan==="none") return '<span class="t">—</span>';
  const exp=u.plan_expires_at?`<div class="t" style="font-size:11px">至 ${fmt(u.plan_expires_at)}</div>`:"";
  return `<span class="plan-badge">${esc(u.plan)}</span>${exp}`;
}
function renderUsersTable(q){
  const w=$("usersTable"); if(!w) return;
  let list=usersCache;
  if(q) list=list.filter(u=>u.email.toLowerCase().includes(q)||u.role.toLowerCase().includes(q)||(u.plan||"").toLowerCase().includes(q));
  if($("userCount")) $("userCount").textContent=`共 ${usersCache.length} 个用户`+(q?`，匹配 ${list.length} 个`:"");
  if(!list.length){ w.innerHTML='<div class="muted">没有匹配的用户</div>'; return; }
  const rows=list.map(u=>{
    const isSelf=me&&u.id===me.id;
    const toggle=u.role==="admin"
      ? `<button class="btn sm" data-act="role" data-id="${u.id}" data-role="user">取消管理员</button>`
      : `<button class="btn sm" data-act="role" data-id="${u.id}" data-role="admin">设为管理员</button>`;
    const grant=`<button class="btn sm" data-act="gplan" data-id="${u.id}">开通</button><button class="btn sm" data-act="gcredit" data-id="${u.id}">充值</button>`;
    const del=isSelf?"":`<button class="btn sm danger" data-act="del" data-id="${u.id}" data-email="${esc(u.email)}">删除</button>`;
    const role=isSelf?`<span class="t">当前</span>`:toggle;
    return `<tr><td class="email">${esc(u.email)}</td><td><span class="role ${u.role==="admin"?"admin":""}">${esc(u.role)}</span></td><td>${planCell(u)}</td><td class="codeval">${usd(u.credits_cents)}</td><td class="t">${fmt(u.created_at)}</td><td><div class="acts">${role}${grant}${del}</div></td></tr>`;
  }).join("");
  w.innerHTML=`<table><thead><tr><th>账号</th><th>角色</th><th>套餐</th><th>余额</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  w.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",onUserAct));
}
async function onUserAct(e){
  const b=e.currentTarget, id=b.dataset.id, act=b.dataset.act;
  try{
    if(act==="role"){
      await api(`/api/admin/users/${id}/role`,{method:"POST",body:JSON.stringify({role:b.dataset.role})});
      toast(b.dataset.role==="admin"?"已设为管理员":"已取消管理员");
    }else if(act==="del"){
      if(!confirm(`确定删除用户「${b.dataset.email}」？此操作不可恢复。`)) return;
      await api(`/api/admin/users/${id}`,{method:"DELETE"});
      toast("已删除用户");
    }else if(act==="gplan"){
      const plan=(prompt("开通套餐 (trial / basic / pro / power / ultra):","pro")||"").trim();
      if(!plan) return;
      const days=parseInt(prompt("时长(天):","30")||"0",10);
      if(!days||days<=0){ toast("时长无效"); return; }
      await api(`/api/admin/users/${id}/grant`,{method:"POST",body:JSON.stringify({kind:"plan",plan,duration_days:days})});
      toast(`已开通 ${plan} ${days} 天`);
    }else if(act==="gcredit"){
      const amt=parseFloat(prompt("充值金额($):","10")||"0");
      if(!amt){ toast("金额无效"); return; }
      await api(`/api/admin/users/${id}/grant`,{method:"POST",body:JSON.stringify({kind:"credits",credits_cents:Math.round(amt*100)})});
      toast(`已充值 ${usd(Math.round(amt*100))}`);
    }
    await loadUsers();
  }catch(err){ toast(err.message||"操作失败"); }
}

let codesCache = [];
function renderCodes(){

      <select id="codeFilter"><option value="">全部状态</option><option value="unused">未使用</option><option value="used">已使用</option></select>
      <button class="btn" id="codeReload">刷新</button>
      <span class="count" id="codeCount"></span>
    </div>
    <div class="box"><div id="codesTable"><div class="muted">加载中…</div></div></div>
  </div>`;
}
function mountCodes(){
  const k=$("genKind");
  k.addEventListener("change",()=>{ const plan=k.value==="plan"; $("planFields").classList.toggle("hidden",!plan); $("creditFields").classList.toggle("hidden",plan); });
  $("genBtn").addEventListener("click",genCodes);
  $("codeReload").addEventListener("click",loadCodes);
  $("codeFilter").addEventListener("change",renderCodesTable);
  api("/api/admin/users").then(u=>{usersCache=u;}).catch(()=>{}).finally(loadCodes);
}
async function genCodes(){
  const kind=$("genKind").value, count=parseInt($("genCount").value,10)||0, note=$("genNote").value.trim();
  const body={kind,count,note};
  if(kind==="plan"){ body.plan=$("genPlan").value; body.duration_days=parseInt($("genDays").value,10)||0; }
  else { body.credits_cents=Math.round((parseFloat($("genAmount").value)||0)*100); }
  const btn=$("genBtn"); btn.disabled=true; btn.textContent="生成中…";
  try{
    const r=await api("/api/admin/codes",{method:"POST",body:JSON.stringify(body)});
    const text=r.codes.join("\n");
    $("genResult").innerHTML=`<div class="t" style="margin-bottom:6px">已生成 ${r.count} 个：</div><textarea readonly style="width:100%;height:120px;font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(text)}</textarea><div style="margin-top:8px"><button class="btn" id="copyCodes">复制全部</button></div>`;
    $("copyCodes").addEventListener("click",()=>navigator.clipboard.writeText(text).then(()=>toast("已复制"),()=>toast("复制失败")));
    toast(`已生成 ${r.count} 个激活码`); loadCodes();
  }catch(e){ toast(e.message||"生成失败"); }
  finally{ btn.disabled=false; btn.textContent="生成"; }
}
async function loadCodes(){
  try{ codesCache=await api("/api/admin/codes"); renderCodesTable(); }
  catch(e){ if($("codesTable")) $("codesTable").innerHTML=`<div class="muted">加载失败：${esc(e.message)}</div>`; }
}
function codeContent(c){
  if(c.kind==="plan") return `<span class="plan-badge">${esc(c.plan||"")}</span> · ${c.duration_days||0}天`;
  return `<span class="codeval">${usd(c.credits_cents)}</span>`;
}
function emailOf(id){ if(!id) return "—"; const u=usersCache.find(x=>x.id===id); return u?esc(u.email):(String(id).slice(0,8)+"…"); }
function renderCodesTable(){
  const w=$("codesTable"); if(!w) return;
  const f=$("codeFilter")?$("codeFilter").value:"";
  let list=codesCache; if(f) list=list.filter(c=>c.status===f);
  if($("codeCount")) $("codeCount").textContent=`共 ${codesCache.length} 个，未使用 ${codesCache.filter(c=>c.status==="unused").length} 个`;
  if(!list.length){ w.innerHTML='<div class="muted">暂无激活码</div>'; return; }
  const rows=list.map(c=>{
    const st=c.status==="unused"?'<span class="tag register">未使用</span>':'<span class="tag">已使用</span>';
    return `<tr><td class="codeval">${esc(c.code)}</td><td>${c.kind==="plan"?"套餐":"额度"}</td><td>${codeContent(c)}</td><td>${st}</td><td class="t">${c.status==="used"?emailOf(c.used_by):"—"}</td><td class="t">${esc(c.note||"")}</td><td class="t">${fmt(c.created_at)}</td><td><button class="btn sm danger" data-del="${c.id}">删除</button></td></tr>`;
  }).join("");
  w.innerHTML=`<table><thead><tr><th>激活码</th><th>类型</th><th>内容</th><th>状态</th><th>使用者</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  w.querySelectorAll("button[data-del]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("确定删除该激活码？")) return;
    try{ await api(`/api/admin/codes/${b.dataset.del}`,{method:"DELETE"}); toast("已删除"); loadCodes(); }catch(e){ toast(e.message||"删除失败"); }
  }));
}

function renderEmail(){
  return `<div class="page">

          <span id="mailPlanWrap" class="hidden">套餐 <select id="mailPlan">${PLAN_OPTS.map(p=>`<option value="${p}">${p}</option>`).join("")}</select></span>

          <label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="mailHtml" style="width:auto"> 按 HTML 发送</label>
        </div>
        <input id="mailSubject" placeholder="邮件主题" style="margin-bottom:10px">
        <textarea id="mailBody" placeholder="邮件内容…" style="width:100%;height:160px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px"></textarea>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn b" id="mailSend">发送</button>
          <button class="btn" id="mailTest">发送测试邮件</button>
          <span id="mailResult" class="count"></span>
        </div>
      </div>
    </div>
    <div class="toolbar"><button class="btn" id="logReload">刷新</button><span class="count" id="logCount"></span></div>
    <div class="box"><div id="emailLogs"><div class="muted">加载中…</div></div></div>
  </div>`;
}
function mountEmail(){
  const t=$("mailTarget");
  t.addEventListener("change",()=>{ $("mailPlanWrap").classList.toggle("hidden",t.value!=="plan"); $("mailOneWrap").classList.toggle("hidden",t.value!=="one"); });
  $("mailSend").addEventListener("click",()=>sendMail(false));
  $("mailTest").addEventListener("click",()=>sendMail(true));
  $("logReload").addEventListener("click",loadEmailLogs);
  loadEmailLogs();
}
async function sendMail(isTest){
  const body={ subject:$("mailSubject").value.trim(), body:$("mailBody").value, html:$("mailHtml").checked };
  if(isTest){
    const to=(prompt("测试收件邮箱：","")||"").trim(); if(!to) return;
    body.target="one"; body.email=to;
    if(!body.subject) body.subject="Michael 测试邮件";
    if(!body.body) body.body="这是一封来自 Michael 总后台的测试邮件，收到即代表 SMTP 配置正常。";
  }else{
    const tgt=$("mailTarget").value; body.target=tgt;
    if(tgt==="plan") body.plan=$("mailPlan").value;
    if(tgt==="one") body.email=$("mailOne").value.trim();
    if(!body.subject||!body.body){ toast("请填写主题和内容"); return; }
    if(tgt==="all" && !confirm("确定向【全部用户】群发？")) return;
  }
  const btn=isTest?$("mailTest"):$("mailSend"); const old=btn.textContent; btn.disabled=true; btn.textContent="发送中…";
  try{
    const r=await api("/api/admin/notify",{method:"POST",body:JSON.stringify(body)});
    const msg=r.dev?`SMTP 未配置（开发模式）：记录 ${r.total} 条但未真实发送`:`完成：成功 ${r.sent} / 失败 ${r.failed}（共 ${r.total}）`;
    $("mailResult").textContent=msg; toast(msg); loadEmailLogs();
  }catch(e){ toast(e.message||"发送失败"); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
async function loadEmailLogs(){
  try{
    const rows=await api("/api/admin/email-logs"); const w=$("emailLogs"); if(!w) return;
    if($("logCount")) $("logCount").textContent=`最近 ${rows.length} 条`;
    if(!rows.length){ w.innerHTML='<div class="muted">暂无发送记录</div>'; return; }
    const body=rows.map(l=>{
      const st=l.status==="sent"?'<span class="tag login">成功</span>':l.status==="failed"?'<span class="tag" style="background:#fce8e6;color:var(--red)">失败</span>':'<span class="tag">开发</span>';
      return `<tr><td class="email">${esc(l.to_email)}</td><td>${esc(l.subject)}</td><td>${st}</td><td class="t">${esc(l.error||"")}</td><td class="t">${fmt(l.created_at)}</td></tr>`;
    }).join("");
    w.innerHTML=`<table><thead><tr><th>收件人</th><th>主题</th><th>状态</th><th>错误</th><th>时间</th></tr></thead><tbody>${body}</tbody></table>`;
  }catch(e){ if($("emailLogs")) $("emailLogs").innerHTML=`<div class="muted">加载失败：${esc(e.message)}</div>`; }
}

    return `<tr><td class="email">${esc(o.email)}</td><td>${prodContent(o)}</td><td class="codeval">${usd(o.amount_cents)}</td><td>${st}</td><td class="t">${esc(o.method)}</td><td class="t">${fmt(o.created_at)}</td><td>${acts}</td></tr>`;
  }).join("");
  w.innerHTML=`<table><thead><tr><th>买家</th><th>内容</th><th>金额</th><th>状态</th><th>方式</th><th>下单时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  w.querySelectorAll("button[data-conf]").forEach(b=>b.addEventListener("click",async()=>{ if(!confirm("确认已收到这笔款？将自动开通套餐/额度。")) return; try{ await api(`/api/admin/orders/${b.dataset.conf}/confirm`,{method:"POST"}); toast("已确认收款并发放"); loadOrders(); }catch(e){ toast(e.message||"操作失败"); } }));
  w.querySelectorAll("button[data-cancel]").forEach(b=>b.addEventListener("click",async()=>{ if(!confirm("取消该订单？")) return; try{ await api(`/api/admin/orders/${b.dataset.cancel}/cancel`,{method:"POST"}); toast("已取消"); loadOrders(); }catch(e){ toast(e.message||"操作失败"); } }));
}

/* ---------- module: models ---------- */
let modelsCache=[];
const BRANDS={
  claude:{label:"Claude",color:"#d97757",path:"M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.541Zm-.3712 10.2426 2.2914-5.9456 2.2914 5.9456Z"},
  gpt:{label:"GPT",color:"#10a37f",path:"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7715-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zm-12.6438 4.135l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"},
  deepseek:{label:"DeepSeek",color:"#4d6bfe",path:"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5v-3.07c-1.28-.07-2.2-.43-2.89-1.08-.78-.73-1.16-1.82-1.16-3.24 0-1.24.36-2.27 1.08-3.06.73-.8 1.72-1.3 2.97-1.5V4.5l4 3.5-4 3.5V9.57c-.84.15-1.47.48-1.89.98-.42.5-.63 1.14-.63 1.91 0 .86.22 1.5.66 1.92.44.42 1.07.66 1.86.71V15.5z"},
  gemini:{label:"Gemini",color:"#4285F4",path:"M12 1.5c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"},
  minimax:{label:"MiniMax",color:"#ff4d4f",stroke:true,path:"M4 19V6l8 9 8-9v13"},
  glm:{label:"GLM",color:"#3859ff",stroke:true,path:"M5.5 5h13L5.5 19h13"},
};
BRANDS.anthropic=BRANDS.claude; BRANDS.openai=BRANDS.gpt; BRANDS.google=BRANDS.gemini; BRANDS.zhipu=BRANDS.glm;
const BRAND_KEYS=["claude","gpt","deepseek","gemini","minimax","glm","other"];
function brandSvgInner(b){
  return b.stroke
    ? `<path fill="none" stroke="${b.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="${b.path}"/>`
    : `<path fill="${b.color}" d="${b.path}"/>`;
}
function brandBadge(provider){
  const b=BRANDS[(provider||"").toLowerCase()];
  const inner=b?brandSvgInner(b):`<circle cx="12" cy="12" r="5" fill="#9aa0a6"/>`;
  return `<span style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#fff;border:1px solid var(--line);margin-right:8px;flex:0 0 24px"><svg width="16" height="16" viewBox="0 0 24 24">${inner}</svg></span>`;
}
function brandOptions(sel){ return BRAND_KEYS.map(k=>`<option value="${k}"${k===sel?" selected":""}>${BRANDS[k]?BRANDS[k].label:"其它"}</option>`).join(""); }
function renderModels(){
  return `<div class="page">
    <h3 class="ptitle">模型系统</h3><p class="pdesc">配置 AI 供应商连接；「编辑」里勾选开放哪些模型，启用的会进入 IDE 对话列表。密钥仅存服务器不下发</p>
    <div class="stats">
      <div class="stat"><b id="mdCalls">—</b><span>累计调用</span></div>
      <div class="stat"><b id="mdSpent">—</b><span>累计消耗 (USD)</span></div>
      <div class="stat"><b id="mdCount">—</b><span>连接数</span></div>
    </div>
    <div class="box" style="margin-bottom:20px">
      <h2>添加供应商连接</h2>
      <div style="padding:18px 20px">
        <div class="gen-form">
          名称 <input id="mdLabel" placeholder="如 官方DeepSeek" style="min-width:120px">
          品牌 <select id="mdProvider">${brandOptions("deepseek")}</select>
          baseUrl <input id="mdBase" placeholder="https://api.deepseek.com/v1" style="min-width:230px">
          API Key <input id="mdKey" placeholder="sk-..." style="min-width:170px">
          倍率 <input id="mdRate" type="number" value="1" step="0.1" min="0" style="min-width:70px" title="每1000 token 扣多少美分">
          <button class="btn b" id="mdAdd">添加</button>
        </div>
        <div class="t" style="margin-top:8px">添加后点该行「编辑」拉取并勾选要开放的模型。倍率 = 每 1000 token 扣多少美分。</div>
      </div>
    </div>
    <div class="toolbar"><button class="btn" id="mdReload">刷新</button></div>
    <div class="box"><div id="modelsTable"><div class="muted">加载中…</div></div></div>
  </div>`;
}
function mountModels(){
  $("mdAdd").addEventListener("click",addModel);
  $("mdReload").addEventListener("click",loadModels);
  loadModels();
}
async function addModel(){
  const body={
    label:$("mdLabel").value.trim(), provider:$("mdProvider").value,
    base_url:$("mdBase").value.trim(),
    api_key:$("mdKey").value.trim(), rate:parseFloat($("mdRate").value)||1,
  };
  if(!body.label||!body.base_url){ toast("名称/baseUrl 必填"); return; }
  try{ await api("/api/admin/models",{method:"POST",body:JSON.stringify(body)}); toast("已添加，去点编辑勾选模型"); ["mdLabel","mdKey"].forEach(id=>$(id).value=""); loadModels(); }
  catch(e){ toast(e.message||"添加失败"); }
}
async function loadModels(){
  try{
    modelsCache=await api("/api/admin/models");
    try{ const u=await api("/api/admin/model-usage"); if($("mdCalls")) $("mdCalls").textContent=u.calls; if($("mdSpent")) $("mdSpent").textContent=usd(u.spent_cents); }catch{}
    if($("mdCount")) $("mdCount").textContent=modelsCache.length;
    const w=$("modelsTable"); if(!w) return;
    if(!modelsCache.length){ w.innerHTML='<div class="muted">还没有连接，先在上面添加</div>'; return; }
    const rows=modelsCache.map(m=>{
      const en=(m.enabled_models&&m.enabled_models.length)?`${m.enabled_models.length} 个开放`:'<span class="t">未选择(默认1个)</span>';
      return `<tr><td><div style="display:flex;align-items:center">${brandBadge(m.provider)}<span class="email">${esc(m.label)}</span></div></td><td>${en}</td><td class="t" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(m.base_url)}</td><td class="codeval">${esc(m.api_key_masked||"")}</td><td class="codeval">×${m.rate}</td><td><div class="acts"><button class="btn sm b" data-editmd="${m.id}">编辑</button><button class="btn sm danger" data-delmd="${m.id}">删除</button></div></td></tr>`;
    }).join("");
    w.innerHTML=`<table><thead><tr><th>连接</th><th>开放模型</th><th>baseUrl</th><th>密钥</th><th>倍率</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
    w.querySelectorAll("button[data-delmd]").forEach(b=>b.addEventListener("click",async()=>{ if(!confirm("删除该连接？")) return; try{ await api(`/api/admin/models/${b.dataset.delmd}`,{method:"DELETE"}); toast("已删除"); loadModels(); }catch(e){ toast(e.message||"删除失败"); } }));
    w.querySelectorAll("button[data-editmd]").forEach(b=>b.addEventListener("click",()=>openModelEdit(modelsCache.find(m=>m.id===b.dataset.editmd))));
  }catch(e){ if($("modelsTable")) $("modelsTable").innerHTML=`<div class="muted">加载失败：${esc(e.message)}</div>`; }
}
function openModelEdit(m){
  if(!m) return;
  const enabled=new Set(m.enabled_models||[]);
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(32,33,36,.5);display:grid;place-items:center;z-index:60;padding:24px";
  ov.innerHTML=`<div style="background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow2)">
    <div style="padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center">${brandBadge(m.provider)}<b style="font-size:16px">编辑：${esc(m.label)}</b><span style="flex:1"></span><span id="meClose" style="cursor:pointer;color:var(--dim);font-size:22px;line-height:1">&times;</span></div>
    <div style="padding:20px 22px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div><label style="font-size:12px;color:var(--dim)">名称</label><input id="meLabel" value="${esc(m.label)}"></div>
        <div><label style="font-size:12px;color:var(--dim)">品牌</label><select id="meProvider">${brandOptions((m.provider||"").toLowerCase())}</select></div>
        <div style="grid-column:1/3"><label style="font-size:12px;color:var(--dim)">baseUrl</label><input id="meBase" value="${esc(m.base_url)}"></div>
        <div><label style="font-size:12px;color:var(--dim)">API Key（留空=不改）</label><input id="meKey" placeholder="${esc(m.api_key_masked||"")}"></div>
        <div><label style="font-size:12px;color:var(--dim)">倍率(每1k token 美分)</label><input id="meRate" type="number" step="0.1" min="0" value="${m.rate!=null?m.rate:1}"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0 10px">
        <button class="btn b" id="meFetch">拉取该 Key 可用的模型</button>
        <span class="count" id="meHint">勾选要开放进 IDE 的模型</span>
      </div>
      <div id="meList" style="border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;padding:6px"></div>
    </div>
    <div style="padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px">
      <button class="btn" id="meCancel">取消</button><button class="btn b" id="meSave">保存</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener("click",(e)=>{ if(e.target===ov) close(); });
  ov.querySelector("#meClose").addEventListener("click",close);
  ov.querySelector("#meCancel").addEventListener("click",close);

  function renderList(ids){
    const list=ov.querySelector("#meList");
    if(!ids.length){ list.innerHTML='<div class="muted">点上方按钮拉取，或该 Key 没有可用模型</div>'; return; }
    list.innerHTML=ids.map(id=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer" onmouseover="this.style.background='#f1f3f4'" onmouseout="this.style.background=''"><input type="checkbox" value="${esc(id)}" ${enabled.has(id)?"checked":""} style="width:auto"> ${brandBadge(m.provider)}<span class="codeval">${esc(id)}</span></label>`).join("");
  }
  // start by showing already-enabled ids (so save works even without fetching)
  renderList([...enabled]);
  ov.querySelector("#meFetch").addEventListener("click",async()=>{
    const btn=ov.querySelector("#meFetch"); btn.disabled=true; btn.textContent="拉取中…";
    try{
      const r=await api(`/api/admin/models/${m.id}/available`);
      (r.enabled||[]).forEach(x=>enabled.add(x));
      const ids=r.models&&r.models.length?r.models:[...enabled];
      renderList(ids);
      ov.querySelector("#meHint").textContent=`共 ${r.models?r.models.length:0} 个可用，已勾选 ${enabled.size} 个`;
    }catch(e){ toast(e.message||"拉取失败"); }
    finally{ btn.disabled=false; btn.textContent="拉取该 Key 可用的模型"; }
  });
  ov.querySelector("#meList").addEventListener("change",(e)=>{ if(e.target.type==="checkbox"){ e.target.checked?enabled.add(e.target.value):enabled.delete(e.target.value); } });
  ov.querySelector("#meSave").addEventListener("click",async()=>{
    const body={
      label:ov.querySelector("#meLabel").value.trim(),
      provider:ov.querySelector("#meProvider").value,
      base_url:ov.querySelector("#meBase").value.trim(),
      rate:parseFloat(ov.querySelector("#meRate").value)||0,
      enabled_models:[...enabled],
    };
    const k=ov.querySelector("#meKey").value.trim(); if(k) body.api_key=k;
    try{ await api(`/api/admin/models/${m.id}`,{method:"POST",body:JSON.stringify(body)}); toast(`已保存，开放 ${enabled.size} 个模型`); close(); loadModels(); }
    catch(e){ toast(e.message||"保存失败"); }
  });
}

/* ---------- websocket (global) ---------- */
function connectWs(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage=(ev)=>{ let e; try{e=JSON.parse(ev.data);}catch{return;} addEvent(e); refreshStats(); if(e.kind==="register"){ refreshDashUsers(); } };
  ws.onclose=()=>{ if(token) setTimeout(connectWs,3000); };
}

/* ---------- boot ---------- */
(async()=>{
  if(!token){ show("login"); return; }
  try{ const u=await api("/api/me"); if(u.role==="admin") enterApp(u); else { toast("非管理员账号"); logout(); } }
  catch{ logout(); }
})();
</script>
</body>
</html>
