function mountIdeReleases(){
  $("releaseRefresh").addEventListener("click",()=>loadIdeReleases(true));
  $("releaseDispatch").addEventListener("click",dispatchIdeRelease);
  $("releasePublish").addEventListener("click",()=>publishIdeRelease($("releaseTag").value.trim()));
  $("releaseTag").addEventListener("keydown",e=>{ if(e.key==="Enter") dispatchIdeRelease(); });
  $("releaseRuns").addEventListener("click",e=>{
    const button=e.target.closest("button[data-release-cancel]");
    if(button) cancelIdeReleaseRun(button.dataset.releaseCancel);
  });
  $("releaseRows").addEventListener("click",e=>{
    const button=e.target.closest("button[data-release-publish]");
    if(button) publishIdeRelease(button.dataset.releasePublish);
  });
  loadIdeReleases(false);
  ideReleaseTimer=setInterval(()=>{ if(activeTab==="releases") loadIdeReleases(false); },10000);
}

function safeGithubUrl(value){
  try{
    const url=new URL(value);
    return url.protocol==="https:"&&url.hostname==="github.com"?url.href:"";
  }catch{return "";}
}

function releaseExternalLink(url,label){
  const safe=safeGithubUrl(url);
  return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(label)} <span class="material-symbols-outlined">open_in_new</span></a>`:"";
}

function releaseRunStatus(run){
  if(run.status!=="completed") return {key:"running",label:run.status==="queued"?"等待中":"构建中",spin:true};
  const labels={success:"成功",failure:"失败",cancelled:"已取消",timed_out:"超时",action_required:"需处理",skipped:"已跳过",neutral:"已结束",stale:"已失效"};
  return {key:run.conclusion||"completed",label:labels[run.conclusion]||"已结束",spin:false};
}

function formatAssetSize(bytes){
  const value=Number(bytes)||0;
  if(value<1024) return `${value} B`;
  if(value<1024*1024) return `${(value/1024).toFixed(1)} KB`;
  return `${(value/1024/1024).toFixed(1)} MB`;
}

function renderIdeReleaseRuns(runs){
  const host=$("releaseRuns"); if(!host) return;
  if(!runs.length){ host.innerHTML='<div class="release-empty"><span class="material-symbols-outlined">history</span>还没有工作流记录</div>'; return; }
  host.innerHTML=`<table class="release-table"><thead><tr><th>构建</th><th>状态</th><th>开始时间</th><th>操作</th></tr></thead><tbody>${runs.map(run=>{
    const status=releaseRunStatus(run);
    const url=safeGithubUrl(run.html_url);
    const title=run.head_branch||run.display_title||run.name||`#${run.id}`;
    const canCancel=run.status!=="completed";
    return `<tr><td>${url?`<a class="release-title" href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>`:`<span class="release-title">${esc(title)}</span>`}<span class="release-sub">#${esc(run.id)} · 尝试 ${esc(run.run_attempt||1)}${run.head_sha?` · ${esc(String(run.head_sha).slice(0,7))}`:""}</span></td><td><span class="release-status ${esc(status.key)}">${status.spin?'<i class="status-spinner"></i>':""}${esc(status.label)}</span></td><td class="t">${esc(fmt(run.created_at)||"—")}</td><td>${canCancel?`<button class="btn sm danger" data-release-cancel="${esc(run.id)}">取消</button>`:(url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">日志</a>`:"")}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function renderIdeReleaseRows(releases){
  const host=$("releaseRows"); if(!host) return;
  if(!releases.length){ host.innerHTML='<div class="release-empty"><span class="material-symbols-outlined">deployed_code</span>还没有 Release</div>'; return; }
  host.innerHTML=`<div class="release-list">${releases.map(release=>{
    const url=safeGithubUrl(release.html_url);
    const assets=Array.isArray(release.assets)?release.assets:[];
    const assetHtml=assets.length?assets.map(asset=>`<span class="release-asset" title="${esc(asset.name)} · ${esc(formatAssetSize(asset.size))}">${esc(asset.name)}</span>`).join(""):'<span class="release-sub">尚无构建文件</span>';
    return `<div class="release-item"><div>${url?`<a class="release-title" href="${esc(url)}" target="_blank" rel="noopener">${esc(release.tag_name||release.name||"未命名")}</a>`:`<span class="release-title">${esc(release.tag_name||release.name||"未命名")}</span>`}<span class="release-sub">${esc(fmt(release.published_at||release.created_at)||"—")}</span></div><div class="release-item-state"><span class="release-status ${release.draft?"draft":"success"}">${release.draft?"Draft":"已发布"}</span><div class="release-assets">${assetHtml}</div></div><div class="release-item-action">${release.draft?`<button class="btn sm b" data-release-publish="${esc(release.tag_name||"")}">校验并发布</button>`:(url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">查看</a>`:"")}</div></div>`;
  }).join("")}</div>`;
}

function setIdeReleaseBusy(busy){
  ideReleaseActionBusy=busy;
  const control=$("releaseControl"); if(control) control.classList.toggle("release-loading",busy);
  ["releaseDispatch","releasePublish","releaseRefresh"].forEach(id=>{ const el=$(id); if(el) el.disabled=busy||(id!=="releaseRefresh"&&!ideReleaseState?.configured); });
}

async function loadIdeReleases(manual){
  if(activeTab!=="releases") return;
  const refresh=$("releaseRefresh");
  if(manual&&refresh){ refresh.disabled=true; refresh.innerHTML='<span class="material-symbols-outlined">progress_activity</span> 刷新中'; }
  try{
    const data=await api("/api/admin/ide-releases");
    if(activeTab!=="releases") return;
    ideReleaseState=data;
    const connection=$("releaseConnection");
    connection.classList.toggle("connected",!!data.connected);
    connection.classList.remove("failed");
    $("releaseConnectionTitle").textContent=data.connected?"GitHub 已连接":data.configured?"GitHub 连接不可用":"尚未配置 GitHub";
    $("releaseConnectionMeta").textContent=`${data.repo||"未设置仓库"} · ${data.workflow||"未设置工作流"}`;
    $("releaseLinks").innerHTML=releaseExternalLink(data.actions_url,"Actions")+releaseExternalLink(data.releases_url,"Releases");
    const notice=$("releaseNotConfigured");
    notice.classList.toggle("hidden",!!data.configured);
    notice.innerHTML=data.configured?"":"请在服务器环境变量中配置 <code>IDE_RELEASE_GITHUB_TOKEN</code>，然后重启服务。Token 不会传到浏览器。";
    $("releaseDispatch").disabled=!data.configured;
    $("releasePublish").disabled=!data.configured;
    renderIdeReleaseRuns(Array.isArray(data.runs)?data.runs:[]);
    renderIdeReleaseRows(Array.isArray(data.releases)?data.releases:[]);
    if(manual) toast("GitHub 状态已刷新");
  }catch(e){
    if(activeTab!=="releases") return;
    ideReleaseState=null;
    const connection=$("releaseConnection");
    connection.classList.remove("connected"); connection.classList.add("failed");
    $("releaseConnectionTitle").textContent="GitHub 连接失败";
    $("releaseConnectionMeta").textContent=e.message||"无法读取发布状态";
    $("releaseDispatch").disabled=true;
    $("releasePublish").disabled=true;
    if(manual) toast(e.message||"刷新失败");
  }finally{
    if(refresh){ refresh.disabled=false; refresh.innerHTML='<span class="material-symbols-outlined">refresh</span> 刷新状态'; }
  }
}

function checkedReleaseTag(){
  const input=$("releaseTag");
  const tag=(input?.value||"").trim();
  if(!/^v\d+\.\d+\.\d+$/.test(tag)){
    toast("请输入 vX.Y.Z 格式的 tag");
    input?.focus();
    return "";
  }
  return tag;
}

async function dispatchIdeRelease(){
  if(ideReleaseActionBusy) return;
  const tag=checkedReleaseTag(); if(!tag) return;
  setIdeReleaseBusy(true);
  try{
    await api("/api/admin/ide-releases/dispatch",{method:"POST",body:JSON.stringify({tag})});
    toast(`${tag} 构建已提交`);
    await loadIdeReleases(false);
    setTimeout(()=>loadIdeReleases(false),2500);
  }catch(e){ toast(e.message||"提交构建失败"); }
  finally{ setIdeReleaseBusy(false); }
}

async function cancelIdeReleaseRun(runId){
  if(ideReleaseActionBusy) return;
  if(!runId||!confirm(`取消 Actions 构建 #${runId}？`)) return;
  setIdeReleaseBusy(true);
  try{
    await api(`/api/admin/ide-releases/runs/${encodeURIComponent(runId)}/cancel`,{method:"POST",body:"{}"});
    toast(`构建 #${runId} 已请求取消`);
    await loadIdeReleases(false);
  }catch(e){ toast(e.message||"取消失败"); }
  finally{ setIdeReleaseBusy(false); }
}

async function publishIdeRelease(requestedTag){
  if(ideReleaseActionBusy) return;
  if(requestedTag&&$("releaseTag")) $("releaseTag").value=requestedTag;
  const tag=checkedReleaseTag(); if(!tag) return;
  if(!confirm(`确认发布 ${tag}？\n\n服务端将先校验 latest.json、签名和两个平台安装包。发布后，Michael IDE 用户就能检测到这个版本。`)) return;
  setIdeReleaseBusy(true);
  try{
    const result=await api("/api/admin/ide-releases/publish",{method:"POST",body:JSON.stringify({tag})});
    toast(result.already_published?`${tag} 已经发布`:`${tag} 已发布`);
    await loadIdeReleases(false);
  }catch(e){ toast(e.message||"发布失败"); }
  finally{ setIdeReleaseBusy(false); }
}

/* ---------- websocket (global) ---------- */
function connectWs(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  // The feed is admin-only. A browser can't set an Authorization header on a
  // WebSocket, so authenticate with the first frame instead of the URL (a token in
  // the query string would end up in nginx's access log).
  ws.onopen=()=>{ try{ ws.send(JSON.stringify({type:"auth",token})); }catch{} };
  ws.onmessage=(ev)=>{
    let e; try{e=JSON.parse(ev.data);}catch{return;}
    if(e.type==="auth_ok") return;
    if(e.type==="auth_error"){ toast(e.error||"实时事件流鉴权失败"); return; }
    addEvent(e); refreshStats();
    if(e.kind==="register") refreshDashUsers();
    // Live-patch the user table when ANY user is modified (grant / set_credits /
    // set_plan / cancel). Falls back to a full reload if we're on the users tab
    // but lack the patched user object (e.g. older event shape).
    if((e.kind==="user_updated"||e.kind==="grant"||e.kind==="register")&&activeTab==="users"){
      if(e.data&&e.data.user&&e.user_id){ patchUserRow(e.user_id,e.data.user); }
      else { loadUsers(); }
    }
    if(e.kind==="user_deleted"&&activeTab==="users") loadUsers();
    if(e.kind&&e.kind.startsWith("ide_release_")&&activeTab==="releases") loadIdeReleases(false);
  };
  ws.onclose=()=>{ if(token) setTimeout(connectWs,3000); };
}

/* ---------- boot ---------- */
(async()=>{
  if(!token){ show("login"); return; }
  try{ const u=await api("/api/me"); if(u.role==="admin") enterApp(u); else { toast("非管理员账号"); logout(); } }
  catch{ logout(); }
})();
</script>
