<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>注册 · Michael</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f8f9fa;--surface:#fff;--text:#202124;--dim:#5f6368;--line:#dadce0;--accent:#1a73e8;--accent-d:#1765cc;--green:#1e8e3e;--red:#d93025;
        --shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.6 "Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 40px;width:420px;max-width:100%;box-shadow:var(--shadow);text-align:center}
  .glogo{width:46px;height:46px;margin:0 auto 18px;display:block}
  h1{margin:0 0 6px;font-size:22px;font-weight:500}
  .sub{margin:0 0 26px;color:var(--dim);font-size:14px}
  .field{margin-bottom:16px;text-align:left}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
  input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .code-row{display:flex;gap:10px}
  .code-row input{flex:1}
  .code-btn{white-space:nowrap;background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
  .code-btn:hover:not(:disabled){background:#f1f3f4}
  .code-btn:disabled{color:var(--dim);cursor:default}
  .msg{font-size:13px;min-height:18px;margin:2px 0 12px;text-align:left}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:12px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,box-shadow .15s}
  button.primary:hover:not(:disabled){background:var(--accent-d);box-shadow:var(--shadow)}
  button.primary:disabled{opacity:.6;cursor:default}
  .foot{margin-top:18px;font-size:13px;color:var(--dim)}
  .foot a{color:var(--accent);text-decoration:none}
  .done{display:none}
  .done .material{font-size:0}
  .check{width:56px;height:56px;border-radius:50%;background:#e6f4ea;color:var(--green);display:grid;place-items:center;margin:0 auto 16px;font-size:30px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <svg class="glogo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

      <div id="form">
        <h1>注册 Michael 账号</h1>
        <p class="sub">用邮箱验证码创建你的账号</p>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="code">邮箱验证码</label>
          <div class="code-row">
            <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
            <button class="code-btn" id="sendBtn" type="button">发送验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="password">设置密码</label>
          <input id="password" type="password" placeholder="至少 6 位" autocomplete="new-password" />
        </div>
        <div class="msg" id="msg"></div>
        <button class="primary" id="regBtn">注册</button>
        <div class="foot">已有账号？<a href="/">前往后台登录</a></div>
      </div>

      <div class="done" id="done">
        <div class="check">✓</div>
        <h1>注册成功</h1>
        <p class="sub" id="doneSub">你的 Michael 账号已创建，现在可以在 Mr. Day One 登录使用。</p>
        <button class="primary" onclick="location.href='/'">前往后台</button>
      </div>
    </div>
  </div>

<script>
const $=(id)=>document.getElementById(id);
function setMsg(t,ok){ const m=$("msg"); m.textContent=t||""; m.className="msg"+(t?(ok?" ok":" err"):""); }

let cooling=0;
$("sendBtn").addEventListener("click", sendCode);
$("regBtn").addEventListener("click", register);
$("password").addEventListener("keydown",(e)=>{ if(e.key==="Enter") register(); });

async function sendCode(){
  const email=$("email").value.trim();
  if(!email||!email.includes("@")){ setMsg("请输入有效邮箱"); return; }
  const b=$("sendBtn"); b.disabled=true; const orig=b.textContent; b.textContent="发送中…";
  setMsg("");
  try{
    const r=await fetch("/api/auth/send-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"发送失败");
    setMsg(j.sent?"验证码已发送，请查收邮箱（含垃圾箱）":"验证码已生成（开发模式：请联系管理员查看）",true);
    cooling=60; tick();
  }catch(e){ setMsg(e.message||"发送失败"); b.disabled=false; b.textContent=orig; }
}
function tick(){
  const b=$("sendBtn");
  if(cooling<=0){ b.disabled=false; b.textContent="重新发送"; return; }
  b.disabled=true; b.textContent=`${cooling}s 后重发`; cooling--; setTimeout(tick,1000);
}

async function register(){
  const email=$("email").value.trim(), code=$("code").value.trim(), password=$("password").value;
  if(!email||!email.includes("@")){ setMsg("请输入有效邮箱"); return; }
  if(!code){ setMsg("请输入邮箱验证码"); return; }
  if(password.length<6){ setMsg("密码至少 6 位"); return; }
  const b=$("regBtn"); b.disabled=true; const orig=b.textContent; b.textContent="注册中…"; setMsg("");
  try{
    const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,code})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"注册失败");
    if(j.token){ try{ localStorage.setItem("michael_token", j.token); }catch{} }
    $("form").style.display="none"; $("done").style.display="block";
    $("doneSub").textContent=`账号 ${email} 已创建，现在可以在 Mr. Day One 登录使用。`;
  }catch(e){ setMsg(e.message||"注册失败"); b.disabled=false; b.textContent=orig; }
}
</script>
</body>
</html>
