[package]
name = "devin-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Devin Desktop: a local bridge that securely exposes your files to Devin/AI agents."
default-run = "devin-desktop"

[lib]
name = "devin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../crates/bridge-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# This feature is used for production builds where `devtools` is disabled.
custom-protocol = ["tauri/custom-protocol"]
