<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devin Desktop">
  <defs>
    <linearGradient id="dd-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8DEF"/>
      <stop offset="0.55" stop-color="#3B6EF6"/>
      <stop offset="1" stop-color="#7A5BEF"/>
    </linearGradient>
    <linearGradient id="dd-sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#dd-grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#dd-sheen)"/>
  <!-- bridge / link between two file nodes -->
  <g stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M24 32 a8 8 0 0 1 8 -8 h4" opacity="0.95"/>
    <path d="M40 32 a8 8 0 0 1 -8 8 h-4" opacity="0.95"/>
    <path d="M27 32 h10"/>
  </g>
  <circle cx="20" cy="32" r="4.2" fill="#ffffff"/>
  <circle cx="44" cy="32" r="4.2" fill="#ffffff"/>
</svg>
